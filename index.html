const AdminDietasView = ({ currentUser }) => {
  const [pacientes, setPacientes] = useState([]);
  const [loading, setLoading] = useState(true);
  const [selectedPaciente, setSelectedPaciente] = useState(null);
  const [planosList, setPlanosList] = useState([]);
  const [fichaPacienteData, setFichaPacienteData] = useState(null);
  const [selectedFiles, setSelectedFiles] = useState([]);
  const [uploading, setUploading] = useState(false);
  const [uploadProgress, setUploadProgress] = useState(0);
  const [uploadStatusText, setUploadStatusText] = useState('');

  // Estados dos Modais de IA e Configuração
  const [showAIGeneratorModal, setShowAIGeneratorModal] = useState(false);
  const [showApiKeyModal, setShowApiKeyModal] = useState(false);
  const [selectedAuditPlan, setSelectedAuditPlan] = useState(null);
  const [geminiApiKey, setGeminiApiKey] = useState(() => localStorage.getItem('gemini_api_key') || '');
  const [viewingSpreadsheet, setViewingSpreadsheet] = useState(null);

  React.useEffect(() => {
    // Sincroniza em tempo real a chave Gemini salva no Firebase
    const unsubKey = onValue(ref(db, 'config/geminiApiKey'), (snapshot) => {
      if (snapshot.exists() && snapshot.val()) {
        const val = snapshot.val().trim();
        setGeminiApiKey(val);
        localStorage.setItem('gemini_api_key', val);
      }
    });
    return () => unsubKey();
  }, []);

  React.useEffect(() => {
    const q = query(ref(db, 'users'), orderByChild('role'), equalTo('paciente'));
    const unsubscribe = onValue(q, (snapshot) => {
      const users = [];
      snapshot.forEach(child => users.push({ id: child.key, ...child.val() }));
      setPacientes(users);
      setLoading(false);
      setSelectedPaciente(prev => (prev && !users.some(u => u.id === prev.id) ? null : prev));
    });
    return () => unsubscribe();
  }, []);

  React.useEffect(() => {
    if (!selectedPaciente) {
      setPlanosList([]);
      setFichaPacienteData(null);
      setSelectedFiles([]);
      return;
    }

    // Carregar todas as planilhas do paciente (retrocompatível com planos legados)
    const unsubPlano = onValue(ref(db, `planos/${selectedPaciente.id}`), (snapshot) => {
      const list = normalizePlanosList(snapshot.val());
      setPlanosList(list);
    });

    // Carregar dados da ficha do paciente para a IA
    const unsubFicha = onValue(ref(db, `fichas/${selectedPaciente.id}`), (snapshot) => {
      setFichaPacienteData(snapshot.exists() ? snapshot.val() : null);
    });

    return () => {
      unsubPlano();
      unsubFicha();
    };
  }, [selectedPaciente]);

  // Salvar chave de API
  const handleSaveApiKey = (key) => {
    setGeminiApiKey(key);
    localStorage.setItem('gemini_api_key', key);
    // Salvar também nas preferências do Firebase para persistência multi-dispositivo
    set(ref(db, `config/geminiApiKey`), key).catch(e => console.warn(e));
    notify.success("Chave Gemini salva com sucesso!");
  };

  // Garante que a estrutura seja migrada caso haja nó de plano legado na raiz do paciente
  const ensureMultiPlanFormat = async (pacienteId) => {
    try {
      const snap = await get(ref(db, `planos/${pacienteId}`));
      if (snap.exists()) {
        const val = snap.val();
        if (val && (val.nomeArquivo || val.fileDataUrl)) {
          const legacyKey = push(ref(db, `planos/${pacienteId}`)).key;
          await set(ref(db, `planos/${pacienteId}`), {
            [legacyKey]: val
          });
        }
      }
    } catch (err) {
      console.warn("Aviso na checagem de formato de planos:", err);
    }
  };

  // Upload Manual inteligente direto no Firebase Realtime Database (suporta 1 ou múltiplas planilhas)
  const handleUpload = async (e) => {
    e.preventDefault();
    if (!selectedFiles || selectedFiles.length === 0 || !selectedPaciente) return;

    // Validação de segurança para Realtime Database (máx 3MB por arquivo)
    const MAX_MB = 3;
    for (const file of selectedFiles) {
      if (file.size > MAX_MB * 1024 * 1024) {
        notify.warning(`O arquivo "${file.name}" possui ${(file.size / (1024 * 1024)).toFixed(1)}MB. Para persistência direta no Realtime Database, cada planilha deve ter até ${MAX_MB}MB.`, 'Arquivo Muito Grande');
        return;
      }
    }

    setUploading(true);
    setUploadProgress(10);
    const totalFiles = selectedFiles.length;
    setUploadStatusText(`Preparando ${totalFiles} arquivo(s)...`);

    try {
      await ensureMultiPlanFormat(selectedPaciente.id);

      for (let i = 0; i < totalFiles; i++) {
        const file = selectedFiles[i];
        setUploadStatusText(`Anexando "${file.name}" (${i + 1} de ${totalFiles})...`);
        
        const dataUrl = await fileOrBlobToDataURL(file);
        const newKey = push(ref(db, `planos/${selectedPaciente.id}`)).key;

        // Salva diretamente no Firebase Realtime Database
        await set(ref(db, `planos/${selectedPaciente.id}/${newKey}`), {
          nomeArquivo: file.name,
          tipoArquivo: file.type || 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',
          tamanho: file.size,
          fileDataUrl: dataUrl,
          dataUpload: new Date().toISOString(),
          geradoPorIA: false
        });

        // Backup secundário no Storage (silencioso)
        try {
          if (storage) {
            const fileRef = storageRef(storage, `planos/${selectedPaciente.id}/${file.name}`);
            uploadBytesResumable(fileRef, file).then(async (snap) => {
              const url = await getDownloadURL(snap.ref);
              update(ref(db, `planos/${selectedPaciente.id}/${newKey}`), { url }).catch(() => {});
            }).catch(() => {});
          }
        } catch (_) {}

        setUploadProgress(Math.round(((i + 1) / totalFiles) * 100));
      }

      await update(ref(db, `users/${selectedPaciente.id}`), { planoAtivo: true });

      setUploading(false);
      setSelectedFiles([]);
      setUploadStatusText('');
      setTimeout(() => setUploadProgress(0), 1000);
      notify.success(`${totalFiles === 1 ? 'Planilha anexada' : `${totalFiles} planilhas anexadas`} e salvas com sucesso no Realtime Database!`, 'Upload Concluído');
    } catch (err) {
      console.error("Erro ao salvar planilha(s) no Realtime Database:", err);
      setUploading(false);
      setUploadProgress(0);
      setUploadStatusText('');
      notify.error("Erro ao anexar planilha: " + err.message);
    }
  };

  // Aprovação e entrega de nova Planilha gerada com IA (Dupla Auditoria) - Adiciona ao histórico
  const handleApproveAndDeliverAIPlan = async (excelBlob, planData, fileName) => {
    if (!selectedPaciente) return;
    try {
      await ensureMultiPlanFormat(selectedPaciente.id);
      const dataUrl = await fileOrBlobToDataURL(excelBlob);
      const newKey = push(ref(db, `planos/${selectedPaciente.id}`)).key;

      // Salva diretamente no Firebase Realtime Database na coleção de planos do paciente
      await set(ref(db, `planos/${selectedPaciente.id}/${newKey}`), {
        nomeArquivo: fileName,
        tipoArquivo: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',
        tamanho: excelBlob.size,
        fileDataUrl: dataUrl,
        dataUpload: new Date().toISOString(),
        geradoPorIA: true,
        planoData: planData
      });
      await update(ref(db, `users/${selectedPaciente.id}`), { planoAtivo: true });

      // Opcional: backup em segundo plano no Firebase Storage
      try {
        if (storage) {
          const fileRef = storageRef(storage, `planos/${selectedPaciente.id}/${fileName}`);
          uploadBytesResumable(fileRef, excelBlob).then(async (snap) => {
            const url = await getDownloadURL(snap.ref);
            update(ref(db, `planos/${selectedPaciente.id}/${newKey}`), { url }).catch(() => {});
          }).catch(() => {});
        }
      } catch (_) {}

      setShowAIGeneratorModal(false);
      notify.success("Nova planilha aprovada e salva no Realtime Database do paciente!", 'Plano Aprovado');
    } catch (error) {
      console.error("Erro ao gravar planilha no Realtime Database:", error);
      notify.error("Erro ao entregar plano: " + error.message);
      throw error;
    }
  };

  // Exclusão individual de uma planilha existente
  const handleExcluirPlanilha = async (planilhaId, nomeArquivo) => {
    const confirmed = await showConfirm({
      title: "Excluir Planilha",
      message: `Deseja realmente apagar a planilha "${nomeArquivo || 'selecionada'}"? O arquivo será removido do paciente.`,
      confirmText: "Sim, Excluir",
      cancelText: "Cancelar",
      variant: "danger"
    });
    if (!confirmed) return;
    try {
      if (planilhaId === 'legacy') {
        await remove(ref(db, `planos/${selectedPaciente.id}`));
      } else {
        await remove(ref(db, `planos/${selectedPaciente.id}/${planilhaId}`));
      }

      // Verifica se ainda restou alguma planilha no banco
      const checkSnap = await get(ref(db, `planos/${selectedPaciente.id}`));
      const remaining = normalizePlanosList(checkSnap.val());
      if (remaining.length === 0) {
        await remove(ref(db, `planos/${selectedPaciente.id}`));
        await update(ref(db, `users/${selectedPaciente.id}`), { planoAtivo: false });
      } else {
        await update(ref(db, `users/${selectedPaciente.id}`), { planoAtivo: true });
      }
      notify.success("Planilha apagada com sucesso!");

      console.error("Erro ao apagar planilha:", err);
      notify.error("Erro ao apagar planilha: " + err.message);
    }

        {selectedAuditPlan?.geradoPorIA && selectedAuditPlan?.planoData && (

        {viewingSpreadsheet && (

  }

  // LISTA DE PACIENTES PARA SELEÇÃO (100% mantido)
  return (
    <div className="p-6">
      <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6">
        <div>
          <h2 className="text-2xl font-bold text-gray-800">Planos Alimentares</h2>

        <button 
          onClick={() => setShowApiKeyModal(true)}

        </button>
      </div>

      <div className="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
        {loading ? (
          <div className="p-10 flex flex-col items-center justify-center text-green-600">
            <Loader2 className="w-8 h-8 animate-spin mb-2" />
            <p className="text-gray-500 font-medium">Carregando pacientes...</p>

        ) : pacientes.length === 0 ? (
          <div className="p-10 text-center text-gray-500">
            <Users className="w-12 h-12 text-gray-300 mx-auto mb-3" />

          <table className="w-full text-left border-collapse">
            <thead>
              <tr className="bg-gray-50 border-b border-gray-100 text-gray-500 text-sm">
                <th className="p-4 font-medium">Paciente</th>
                <th className="p-4 font-medium">Status do Plano</th>

            <tbody className="divide-y divide-gray-100">
              {pacientes.map(p => (

// 3.2 Ficha Completa do Paciente (Anamnese Aprimorada com Informações Opcionais)
const PatientFichaView = ({ currentUser }) => {
  const initialFichaState = {
    idade: '',
    peso: '',
    altura: '',
    objetivo: '',
    refeicoesAoDia: '',
    consumoAgua: '',
    horariosRefeicoes: '',
    alimentosFavoritos: '',
    alimentosAversao: '',
    restricoesAlimentares: '',
    nivelAtividade: '',
    exerciciosDescricao: '',
    sono: '',
    saudeIntestinal: '',
    suplementos: '',
    ansiedadeAlimentar: '',
    historicoMedico: '',
    habitos: '',
    observacoes: ''
  };

  const [ficha, setFicha] = useState(initialFichaState);
  const [salvando, setSalvando] = useState(false);
  const [loading, setLoading] = useState(true);
  const [pacienteInfo, setPacienteInfo] = useState({ nome: currentUser?.nome || '', email: currentUser?.email || '' });

  React.useEffect(() => {
    if (!currentUser?.uid) return;

    // Buscar informações cadastrais do paciente para personalização
    get(ref(db, `users/${currentUser.uid}`)).then(snap => {
      if (snap.exists()) {
        const uVal = snap.val();
        setPacienteInfo({
          nome: uVal.nome || currentUser.nome || '',
          email: uVal.email || currentUser.email || ''
        });
      }
    }).catch(e => console.warn(e));

    const unsubscribe = onValue(ref(db, `fichas/${currentUser.uid}`), (snapshot) => {
      if (snapshot.exists()) {
        const val = snapshot.val();
        setFicha(prev => ({
          ...initialFichaState,
          ...val
        }));
      }
      setLoading(false);
    });
    return () => unsubscribe();
  }, [currentUser?.uid]);

  const handleSalvar = async (e) => {
    e.preventDefault();
    if (currentUser?.readOnly) return;
    setSalvando(true);
    try {
      await set(ref(db, `fichas/${currentUser.uid}`), {
        ...ficha,
        atualizadoEm: serverTimestamp()
      });
      notify.success("Ficha do paciente salva com sucesso!");
    } catch(err) {
      console.error(err);
      notify.error("Erro ao salvar a ficha do paciente.");
    } finally {
      setSalvando(false);
    }
  };

  const handleChange = (e) => {
    if (currentUser?.readOnly) return;
    const { name, value } = e.target;
    setFicha(prev => ({ ...prev, [name]: value }));
  };

  const handleQuickSelect = (fieldName, optionValue) => {
    if (currentUser?.readOnly) return;
    setFicha(prev => ({ ...prev, [fieldName]: optionValue }));
  };

  // Cálculo de IMC em tempo real
  const pesoNum = parseFloat(ficha.peso);
  const alturaNum = parseFloat(ficha.altura);
  let imc = null;
  let imcClass = null;
  let imcBadgeColor = 'bg-gray-100 text-gray-700 border-gray-200';

  if (pesoNum > 0 && alturaNum > 0) {
    const alturaMetros = alturaNum > 3 ? alturaNum / 100 : alturaNum;
    const calc = pesoNum / (alturaMetros * alturaMetros);
    if (!isNaN(calc) && calc > 10 && calc < 80) {
      imc = calc.toFixed(1);
      if (calc < 18.5) {
        imcClass = 'Abaixo do peso';
        imcBadgeColor = 'bg-amber-100 text-amber-800 border-amber-300';
      } else if (calc < 25) {
        imcClass = 'Peso saudável (Eutrofia)';
        imcBadgeColor = 'bg-emerald-100 text-emerald-800 border-emerald-300';
      } else if (calc < 30) {
        imcClass = 'Sobrepeso';
        imcBadgeColor = 'bg-orange-100 text-orange-800 border-orange-300';
      } else {
        imcClass = 'Obesidade';
        imcBadgeColor = 'bg-rose-100 text-rose-800 border-rose-300';
      }
    }
  }

  // Progresso de preenchimento da ficha
  const camposRecomendados = [
    ficha.idade, ficha.peso, ficha.altura, ficha.objetivo,
    ficha.refeicoesAoDia, ficha.consumoAgua, ficha.alimentosFavoritos,
    ficha.alimentosAversao, ficha.restricoesAlimentares, ficha.nivelAtividade,
    ficha.sono, ficha.historicoMedico
  ];
  const preenchidos = camposRecomendados.filter(v => v && String(v).trim().length > 0).length;
  const percentualPreenchimento = Math.round((preenchidos / camposRecomendados.length) * 100);

  const formatAtualizado = () => {
    if (!ficha.atualizadoEm) return null;
    try {
      const d = ficha.atualizadoEm.toDate ? ficha.atualizadoEm.toDate() : new Date(ficha.atualizadoEm);
      return d.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
    } catch(e) { return null; }
  };

  const renderQuickChip = (fieldName, optionText) => {
    if (currentUser?.readOnly) return null;
    const isSelected = ficha[fieldName] === optionText;
    return (
      <button
        type="button"
        key={optionText}
        onClick={() => handleQuickSelect(fieldName, optionText)}
        className={`px-3 py-1.5 text-xs font-medium rounded-lg border transition-all text-left flex items-center gap-1.5 ${
          isSelected
            ? 'bg-emerald-100 text-emerald-900 border-emerald-400 ring-1 ring-emerald-400 font-semibold shadow-xs'
            : 'bg-gray-50 hover:bg-gray-100 text-gray-700 border-gray-200'
        } cursor-pointer hover:border-gray-300`}
      >
        {isSelected && <Check className="w-3.5 h-3.5 text-emerald-600 flex-shrink-0" />}
        <span>{optionText}</span>
      </button>
    );
  };

  if (loading) {
    return (
      <div className="p-8 flex flex-col items-center justify-center min-h-[300px]">
        <Loader2 className="w-8 h-8 text-emerald-600 animate-spin mb-3" />
        <p className="text-gray-500 font-medium">Carregando ficha de anamnese...</p>
      </div>
    );
  }

  return (
    <div className="p-4 sm:p-6 max-w-4xl mx-auto space-y-6">
      {/* Banner de Modo Leitura (Nutricionista) */}
      {currentUser?.readOnly ? (
        <div className="bg-gradient-to-r from-emerald-50 via-teal-50 to-green-50 border border-emerald-200 rounded-2xl p-5 shadow-xs flex flex-col sm:flex-row sm:items-center justify-between gap-4">

// 3.3 Chat com Nutricionista (Funcional com Firebase)
// Função utilitária para gerar o chatId consistente entre dois usuários
const generateChatId = (uid1, uid2) => {
  return [uid1, uid2].sort().join('_');
};

// Função utilitária para formatar timestamp
const formatMessageTime = (timestamp) => {
  if (!timestamp) return '';
  const date = timestamp.toDate ? timestamp.toDate() : new Date(timestamp);
  const now = new Date();
  const diffDays = Math.floor((now - date) / (1000 * 60 * 60 * 24));
  const timeStr = date.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
  
  if (diffDays === 0) return `Hoje, ${timeStr}`;
  if (diffDays === 1) return `Ontem, ${timeStr}`;
  return `${date.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' })}, ${timeStr}`;
};

// Componente reutilizável de Chat
const ChatComponent = ({ currentUserId, otherUserId, otherUserName, otherUserInitials, isAdmin, customChatId, isConsultaInfo }) => {
  const [messages, setMessages] = useState([]);
  const [newMessage, setNewMessage] = useState('');
  const [loadingMessages, setLoadingMessages] = useState(true);
  const [sending, setSending] = useState(false);
  const messagesEndRef = React.useRef(null);

  const chatId = customChatId || generateChatId(currentUserId, otherUserId);

  // Scroll automático para a última mensagem
  const scrollToBottom = () => {
    messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' });
  };

  React.useEffect(() => {
    scrollToBottom();
  }, [messages]);

  // Função para deletar mensagem (Apenas Admin)
  const handleDeleteMessage = async (msgId) => {
    const confirmed = await showConfirm({
      title: "Apagar Mensagem",
      message: "Deseja realmente apagar esta mensagem para ambos os participantes da conversa?",
      confirmText: "Sim, Apagar",
      cancelText: "Cancelar",
      variant: "danger"
    });
    if (!confirmed) return;
    try {
      await remove(ref(db, `chats/${chatId}/messages/${msgId}`));
      notify.success("Mensagem apagada com sucesso.");
    } catch (error) {
      console.error('Erro ao deletar mensagem:', error);
      notify.error("Erro ao apagar mensagem.");
    }
  };

  // Ouvir mensagens em tempo real
  React.useEffect(() => {
    if (!chatId) return;

    if (currentUserId) {
      remove(ref(db, `unreadMessages/${currentUserId}/${chatId}`)).catch(e => console.error(e));
    }

    const messagesRef = ref(db, `chats/${chatId}/messages`);
    const q = query(messagesRef, orderByChild('timestamp'));

    const unsubscribe = onValue(q, (snapshot) => {
      const msgs = [];
      snapshot.forEach((childSnapshot) => {
        msgs.push({ id: childSnapshot.key, ...childSnapshot.val() });
      });
      setMessages(msgs);
      setLoadingMessages(false);
    }, (error) => {
      console.error('Erro ao carregar mensagens:', error);
      setLoadingMessages(false);
    });

    return () => unsubscribe();
  }, [chatId]);

  // Enviar mensagem
  const handleSendMessage = async (e) => {
    e.preventDefault();
    const trimmed = newMessage.trim();
    if (!trimmed || sending) return;

    setSending(true);
    try {
      // Garantir que o documento do chat existe
      await update(ref(db, `chats/${chatId}`), {
        participants: [currentUserId, otherUserId],
        updatedAt: serverTimestamp()
      });

      // Adicionar a mensagem na subcoleção
      const newMessageRef = push(ref(db, `chats/${chatId}/messages`));
      await set(newMessageRef, {
        text: trimmed,
        senderId: currentUserId,
        timestamp: serverTimestamp()
      });

      // Notifica o outro usuário
      await set(ref(db, `unreadMessages/${otherUserId}/${chatId}`), true);

      setNewMessage('');
    } catch (error) {
      console.error('Erro ao enviar mensagem:', error);
    } finally {
      setSending(false);
    }
  };

  return (
    <div className="h-[calc(100vh-80px)] flex flex-col">
      {/* Header do Chat */}
      <div className="mb-4 flex items-center justify-between bg-white p-4 rounded-xl shadow-sm border border-gray-100">
        <div className="flex items-center space-x-3">
          <div className="w-10 h-10 rounded-full bg-green-200 flex items-center justify-center text-green-700 font-bold">
            {otherUserInitials}
          </div>
          <div>
            <h2 className="text-lg font-bold text-gray-800">{otherUserName}</h2>
            <p className="text-xs text-green-600 font-medium">Chat ativo</p>
          </div>
        </div>
        {isConsultaInfo && (
          <div className="text-right">
            <span className="bg-yellow-100 text-yellow-800 text-xs font-semibold px-2.5 py-0.5 rounded border border-yellow-200">
              {isConsultaInfo}
            </span>
          </div>
        )}
      </div>

      {/* Área de Mensagens */}
      <div className="flex-1 bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden flex flex-col">
        <div className="flex-1 p-4 overflow-y-auto space-y-4 bg-slate-50/50">
          {loadingMessages ? (
            <div className="flex-1 flex flex-col items-center justify-center h-full py-20">
              <Loader2 className="w-8 h-8 text-green-600 animate-spin mb-2" />
              <p className="text-gray-500 text-sm">Carregando mensagens...</p>
            </div>
          ) : messages.length === 0 ? (
            <div className="flex-1 flex flex-col items-center justify-center h-full py-20">
              <MessageCircle className="w-12 h-12 text-gray-300 mb-3" />
              <p className="text-gray-500 font-medium">Nenhuma mensagem ainda</p>
              <p className="text-gray-400 text-sm">Envie a primeira mensagem para iniciar a conversa!</p>
            </div>
          ) : (
            messages.map((msg) => {
              const isOwn = msg.senderId === currentUserId;
              return (
                <div key={msg.id} className={`flex ${isOwn ? 'justify-end' : 'justify-start'} group mb-2`}>
                  <div className={`p-3 rounded-2xl max-w-[80%] shadow-sm relative ${
                    isOwn 
                      ? 'bg-green-600 text-white rounded-tr-none' 
                      : 'bg-white border border-gray-200 rounded-tl-none'
                  }`}>
                    {isAdmin && (
                      <button 
                        onClick={() => handleDeleteMessage(msg.id)}
                        className={`absolute top-2 ${isOwn ? '-left-8' : '-right-8'} text-red-500 opacity-0 group-hover:opacity-100 transition-opacity p-1 bg-red-50 rounded-full hover:bg-red-100`}
                        title="Apagar mensagem"
                      >
                        <Trash2 className="w-4 h-4" />
                      </button>
                    )}
                    <p className={`text-sm ${isOwn ? 'text-white' : 'text-gray-800'}`}>{msg.text}</p>
                    <span className={`text-[10px] mt-1 block ${
                      isOwn ? 'text-green-200 text-right' : 'text-gray-400'
                    }`}>
                      {formatMessageTime(msg.timestamp)}
                    </span>
                  </div>
                </div>
              );
            })
          )}
          <div ref={messagesEndRef} />
        </div>

        {/* Input de Mensagem */}
        <form onSubmit={handleSendMessage} className="p-3 border-t border-gray-100 bg-white flex items-center gap-2">
          <input 
            type="text" 
            placeholder="Digite sua mensagem..." 
            value={newMessage}
            onChange={(e) => setNewMessage(e.target.value)}
            className="flex-1 px-4 py-2 border border-gray-300 rounded-full focus:outline-none focus:ring-2 focus:ring-green-500 text-sm" 
          />
          <button 
            type="submit"
            disabled={sending || !newMessage.trim()}
            className={`p-2 rounded-full transition-colors ${
              sending || !newMessage.trim() 
                ? 'bg-gray-300 text-gray-500 cursor-not-allowed' 
                : 'bg-green-600 text-white hover:bg-green-700'
            }`}
          >
            {sending ? <Loader2 className="w-5 h-5 animate-spin" /> : <Send className="w-5 h-5" />}
          </button>
        </form>
      </div>
    </div>
  );
};

const PatientScheduleView = ({ currentUser }) => {
  const [dataReq, setDataReq] = useState('');
  const [horaReq, setHoraReq] = useState('');
  const [obsReq, setObsReq] = useState('');
  const [consultas, setConsultas] = useState([]);
  const [loading, setLoading] = useState(true);
  const [enviando, setEnviando] = useState(false);

  React.useEffect(() => {
    const q = query(ref(db, 'consultas'), orderByChild('pacienteId'), equalTo(currentUser.uid));
    const unsubscribe = onValue(q, (snapshot) => {
      const lista = [];
      snapshot.forEach(child => {
        lista.push({ id: child.key, ...child.val() });
      });
      // Ordenar por timestamp
      lista.sort((a, b) => b.timestamp - a.timestamp);
      setConsultas(lista);
      setLoading(false);
    });
    return () => unsubscribe();
  }, [currentUser.uid]);

  const handleSolicitar = async (e) => {
    e.preventDefault();
    if(!dataReq || !horaReq) return;
    setEnviando(true);
    try {
      const novaRef = push(ref(db, 'consultas'));
      await set(novaRef, {
        pacienteId: currentUser.uid,
        pacienteNome: currentUser.displayName || currentUser.email, // Será útil para o admin
        data: dataReq,
        hora: horaReq,
        observacoes: obsReq,
        status: 'Pendente',
        timestamp: serverTimestamp()
      });
      setDataReq('');
      setHoraReq('');
      setObsReq('');
      notify.success("Solicitação enviada com sucesso! Aguarde a aprovação da nutricionista.", "Agendamento Solicitado");
    } catch(err) {
      console.error(err);
      notify.error("Erro ao solicitar consulta.");
    } finally {
      setEnviando(false);
    }
  };

  return (
    <div className="p-6">
      <h2 className="text-2xl font-bold text-gray-800 mb-6">Agendar Consulta</h2>
      
      <div className="grid grid-cols-1 md:grid-cols-2 gap-6">

              <label className="block text-sm font-medium text-gray-700 mb-1">Data Desejada</label>

            </div>
            <div>
              <label className="block text-sm font-medium text-gray-700 mb-1">Período / Hora</label>
              <input type="time" value={horaReq} onChange={e=>setHoraReq(e.target.value)} required className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 outline-none" />
            </div>
            <div>
              <label className="block text-sm font-medium text-gray-700 mb-1">Observações</label>
              <textarea rows="3" value={obsReq} onChange={e=>setObsReq(e.target.value)} className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 outline-none" placeholder="Motivo ou preferência..."></textarea>
            </div>
            <button type="submit" disabled={enviando} className="w-full bg-green-600 hover:bg-green-700 text-white font-medium py-2 rounded-lg transition-colors flex justify-center">
              {enviando ? <Loader2 className="w-5 h-5 animate-spin"/> : 'Solicitar Agendamento'}
            </button>
          </form>
        </div>

        <div className="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
          <h3 className="text-lg font-semibold text-gray-800 mb-4">Meus Agendamentos</h3>
          <div className="space-y-3">
            {loading ? <p className="text-sm text-gray-500">Carregando...</p> : 
             consultas.length === 0 ? <p className="text-sm text-gray-500">Nenhuma solicitação.</p> :
             consultas.map(c => (
              <div key={c.id} className={`border rounded-lg p-4 flex flex-col gap-2 ${c.status === 'Aprovado' ? 'border-green-200 bg-green-50' : 'border-yellow-200 bg-yellow-50'}`}>

                      <span className={`inline-block text-xs font-bold px-2 py-1 rounded-full border ${
                        c.status === 'Aprovado' ? 'text-green-600 bg-green-100 border-green-200' : 'text-yellow-600 bg-yellow-100 border-yellow-200'
                      }`}>
                        {c.status === 'Aprovado' ? 'Aprovado' : 'Aguardando Confirmação'}
                      </span>
                      {c.status === 'Aprovado' && currentUser.onOpenConsultaChat && (
                        <button 
                          onClick={() => currentUser.onOpenConsultaChat(c)}
                          className="bg-blue-600 hover:bg-blue-700 text-white px-3 py-1 rounded text-xs font-medium transition-colors flex items-center"
                        >
                          <MessageCircle className="w-3 h-3 mr-1" /> Chat
                        </button>
                      )}
                    </div>
                  </div>
                </div>
              </div>
             ))
            }
          </div>
        </div>
      </div>
    </div>
  );
};

const PatientRoutineView = ({ currentUser, onNavigate, readOnly = false, pacienteNome = '' }) => {
  const targetUid = currentUser?.uid;
  const [itens, setItens] = useState([]);
  const [conclusoesHoje, setConclusoesHoje] = useState({});
  const [loading, setLoading] = useState(true);
  const [activeFilter, setActiveFilter] = useState('todas');
  const [notifPermission, setNotifPermission] = useState(
    typeof window !== 'undefined' && 'Notification' in window ? Notification.permission : 'denied'
  );

  // Modais
  const [showItemModal, setShowItemModal] = useState(false);
  const [editingItem, setEditingItem] = useState(null);
  const [itemForm, setItemForm] = useState({
    titulo: '',
    categoria: 'agua',
    horario: '08:00',
    lembrete: true,
    observacao: ''
  });

  const [showWaterModal, setShowWaterModal] = useState(false);
  const [waterForm, setWaterForm] = useState({
    metaMl: 2500,
    doseMl: 350,
    horaInicio: '07:30',
    horaFim: '21:30',
    substituirExistentes: true
  });

  // Chave da data de hoje (YYYY-MM-DD local)
  const getTodayKey = () => {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  };
  const todayKey = getTodayKey();

  // Data formatada para exibição
  const dataExtenso = new Intl.DateTimeFormat('pt-BR', { 
    weekday: 'long', 
    day: 'numeric', 
    month: 'long' 
  }).format(new Date());

  // Escuta os itens da rotina e as conclusões de hoje do usuário no Realtime Database
  React.useEffect(() => {
    if (!targetUid) {
      setLoading(false);
      return;
    }

    const rotinaRef = ref(db, `rotinas/${targetUid}/itens`);
    const unsubRotina = onValue(rotinaRef, (snap) => {
      if (snap.exists()) {
        const val = snap.val();
        const lista = Object.entries(val).map(([k, v]) => ({ id: k, ...v }));
        lista.sort((a, b) => (a.horario || '00:00').localeCompare(b.horario || '00:00'));
        setItens(lista);
      } else {
        setItens([]);
      }
      setLoading(false);
    });

    const conclRef = ref(db, `rotinas/${targetUid}/conclusoes/${todayKey}`);
    const unsubConcl = onValue(conclRef, (snap) => {
      if (snap.exists()) {
        setConclusoesHoje(snap.val());
      } else {
        setConclusoesHoje({});
      }
    });

    return () => {
      unsubRotina();
      unsubConcl();
    };
  }, [targetUid, todayKey]);

  // Alterna conclusão da tarefa no dia de hoje
  const handleToggleConclusao = async (itemId) => {
    if (readOnly || !targetUid) return;
    const isDone = !!conclusoesHoje[itemId];
    try {
      if (isDone) {
        await remove(ref(db, `rotinas/${targetUid}/conclusoes/${todayKey}/${itemId}`));
      } else {
        await set(ref(db, `rotinas/${targetUid}/conclusoes/${todayKey}/${itemId}`), true);
      }
    } catch (err) {
      console.error("Erro ao alterar conclusão:", err);
      notify.error("Não foi possível atualizar o status da tarefa.");
    }
  };

  // Alterna lembrete/aviso da tarefa
  const handleToggleLembrete = async (itemId, currentLembrete) => {
    if (readOnly || !targetUid) return;
    try {
      await update(ref(db, `rotinas/${targetUid}/itens/${itemId}`), {
        lembrete: !currentLembrete
      });
    } catch (err) {
      console.error("Erro ao alterar lembrete:", err);
    }
  };

  // Excluir tarefa da rotina
  const handleDeleteItem = async (itemId) => {
    if (readOnly || !targetUid) return;
    const confirmed = await showConfirm({
      title: "Remover Tarefa",
      message: "Deseja realmente remover esta tarefa da sua rotina diária?",
      confirmText: "Sim, Remover",
      cancelText: "Cancelar",
      variant: "danger"
    });
    if (!confirmed) return;
    try {
      await remove(ref(db, `rotinas/${targetUid}/itens/${itemId}`));
      await remove(ref(db, `rotinas/${targetUid}/conclusoes/${todayKey}/${itemId}`));
      notify.success("Tarefa removida com sucesso da rotina.");
    } catch (err) {
      console.error("Erro ao excluir item:", err);
      notify.error("Erro ao excluir item da rotina.");
    }
  };

  // Abrir modal de criação
  const handleOpenCreateModal = () => {
    setEditingItem(null);
    setItemForm({
      titulo: '',
      categoria: 'agua',
      horario: '08:00',
      lembrete: true,
      observacao: ''
    });
    setShowItemModal(true);
  };

  // Abrir modal de edição
  const handleOpenEditModal = (item) => {
    setEditingItem(item);
    setItemForm({
      titulo: item.titulo || '',
      categoria: item.categoria || 'agua',
      horario: item.horario || '08:00',
      lembrete: item.lembrete !== false,
      observacao: item.observacao || ''
    });
    setShowItemModal(true);
  };

  // Salvar tarefa (nova ou editada)
  const handleSaveItem = async (e) => {
    e.preventDefault();
    if (!itemForm.titulo.trim()) {
      notify.warning("Por favor, preencha o título da tarefa.");
      return;
    }
    try {
      if (editingItem) {
        await update(ref(db, `rotinas/${targetUid}/itens/${editingItem.id}`), {
          ...itemForm,
          titulo: itemForm.titulo.trim(),
          observacao: itemForm.observacao.trim(),
          atualizadoEm: serverTimestamp()
        });
      } else {
        const novoRef = push(ref(db, `rotinas/${targetUid}/itens`));
        await set(novoRef, {
          ...itemForm,
          titulo: itemForm.titulo.trim(),
          observacao: itemForm.observacao.trim(),
          criadoEm: serverTimestamp()
        });
      }
      setShowItemModal(false);
      notify.success(editingItem ? "Tarefa atualizada com sucesso!" : "Nova tarefa adicionada à rotina!");
    } catch (err) {
      console.error("Erro ao salvar item:", err);
      notify.error("Erro ao salvar tarefa na rotina.");
    }
  };

  // Carregar modelo pré-definido de rotina
  const handleCarregarPreset = async () => {
    if (readOnly || !targetUid) return;
    if (itens.length > 0) {
      const confirmed = await showConfirm({
        title: "Carregar Modelo Recomendado",
        message: "Isso adicionará o modelo saudável recomendado à sua rotina atual. Deseja continuar?",
        confirmText: "Adicionar Modelo",
        cancelText: "Cancelar",
        variant: "warning"
      });
      if (!confirmed) return;
    }
    try {
      const updates = {};
      ROTINA_PRESETS_RECOMENDADOS.forEach((preset) => {
        const newKey = push(ref(db, `rotinas/${targetUid}/itens`)).key;
        updates[`rotinas/${targetUid}/itens/${newKey}`] = {
          ...preset,
          criadoEm: Date.now()
        };
      });
      await update(ref(db), updates);
      notify.success("Modelo saudável carregado com sucesso na rotina!");
    } catch (err) {
      console.error("Erro ao carregar modelo:", err);
      notify.error("Erro ao carregar rotina sugerida.");
    }
  };

  // Gerador Inteligente de Horários de Água
  const handleGerarAvisosAgua = async (e) => {
    e.preventDefault();
    if (readOnly || !targetUid) return;

    const { metaMl, doseMl, horaInicio, horaFim, substituirExistentes } = waterForm;
    const [hIni, mIni] = horaInicio.split(':').map(Number);
    const [hFim, mFim] = horaFim.split(':').map(Number);
    
    const minInicio = hIni * 60 + mIni;
    const minFim = hFim * 60 + mFim;

    if (minFim <= minInicio) {
      notify.warning("O horário final deve ser após o horário inicial.");
      return;
    }

    const totalDoses = Math.max(2, Math.round(Number(metaMl) / Number(doseMl)));
    const intervaloMin = Math.floor((minFim - minInicio) / (totalDoses - 1));

    const novosItens = [];
    for (let i = 0; i < totalDoses; i++) {
      const minAtual = minInicio + i * intervaloMin;
      const h = Math.floor(minAtual / 60);
      const m = minAtual % 60;
      const horarioFormatado = `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
      
      novosItens.push({
        titulo: `Beber Água (${doseMl}ml)`,
        categoria: 'agua',
        horario: horarioFormatado,
        lembrete: true,
        observacao: `Meta de ${metaMl}ml no dia • Copo/Dose ${i + 1} de ${totalDoses}`
      });
    }

    try {
      // Se optou por substituir existentes, remove tarefas anteriores da categoria agua
      if (substituirExistentes) {
        const itensAgua = itens.filter(i => i.categoria === 'agua');
        for (const item of itensAgua) {
          await remove(ref(db, `rotinas/${targetUid}/itens/${item.id}`));
        }
      }

      // Adiciona os novos horários
      const updates = {};
      novosItens.forEach((item) => {
        const newKey = push(ref(db, `rotinas/${targetUid}/itens`)).key;
        updates[`rotinas/${targetUid}/itens/${newKey}`] = {
          ...item,
          criadoEm: Date.now()
        };
      });
      await update(ref(db), updates);

      setShowWaterModal(false);
      notify.success(`${novosItens.length} horários de água foram programados com avisos nas notificações.`, "Rotina de Hidratação");
    } catch (err) {
      console.error("Erro ao gerar avisos de água:", err);
      notify.error("Erro ao programar horários de água.");
    }
  };

  // Pedir permissão para notificações no navegador
  const handleRequestNotifPermission = async () => {
    if (typeof window === 'undefined' || !('Notification' in window)) {
      notify.info("Seu navegador não oferece suporte a notificações nativas.");
      return;
    }
    try {
      const res = await Notification.requestPermission();
      setNotifPermission(res);
      if (res === 'granted') {
        new Notification("NutriApp: Notificações Ativadas!", {
          body: "Você receberá avisos da sua rotina e horários de água diretamente neste dispositivo.",
          icon: "https://cdn-icons-png.flaticon.com/512/3100/3100566.png"
        });
      }
    } catch(err) {
      console.error(err);
    }
  };

  // Estatísticas do dia
  const totalTarefas = itens.length;
  const tarefasConcluidas = itens.filter(i => !!conclusoesHoje[i.id]).length;
  const percentualConclusao = totalTarefas > 0 ? Math.round((tarefasConcluidas / totalTarefas) * 100) : 0;

  // Estatísticas específicas de água
  const itensAgua = itens.filter(i => i.categoria === 'agua');
  const aguaConcluida = itensAgua.filter(i => !!conclusoesHoje[i.id]).length;

  // Filtragem da lista
  const itensFiltrados = itens.filter(item => {
    if (activeFilter === 'todas') return true;
    return item.categoria === activeFilter;
  });

  return (
    <div className="p-4 sm:p-6 max-w-6xl mx-auto space-y-6">
      
      {/* Cabeçalho da Visão */}
      <div className="flex flex-col md:flex-row md:items-center justify-between gap-4">
        <div>
          <div className="flex items-center gap-2">
            <h2 className="text-2xl sm:text-3xl font-extrabold text-gray-800">
              {readOnly ? `Rotina de ${pacienteNome || 'Paciente'}` : 'Minha Rotina Diária'}
            </h2>
            <span className="px-2.5 py-0.5 rounded-full text-xs font-semibold bg-green-100 text-green-700 capitalize">
              {dataExtenso}
            </span>
          </div>
          <p className="text-gray-500 text-sm mt-1">
            {readOnly 
              ? 'Acompanhamento de adesão a hábitos, ingestão de água e horários de avisos.' 
              : 'Monte seu checklist diário, configure horários de avisos e mantenha sua disciplina!'}
          </p>
        </div>

        {!readOnly && (
          <div className="flex flex-wrap items-center gap-2">
            {/* Botão de Notificação do Navegador */}
            <button
              onClick={handleRequestNotifPermission}
              className={`px-3 py-2 rounded-xl text-xs font-semibold flex items-center gap-1.5 transition-colors border ${
                notifPermission === 'granted'
                  ? 'bg-blue-50 text-blue-700 border-blue-200'
                  : 'bg-white text-gray-700 hover:bg-gray-50 border-gray-200 shadow-sm'
              }`}
              title="Ativar avisos nativos na área de trabalho ou celular"
            >
              <BellRing className={`w-3.5 h-3.5 ${notifPermission === 'granted' ? 'text-blue-600' : 'text-gray-400'}`} />
              {notifPermission === 'granted' ? 'Avisos no Navegador: Ativos' : 'Ativar Avisos no Navegador'}
            </button>

            {/* Botão do Gerador de Água */}
            <button
              onClick={() => setShowWaterModal(true)}
              className="bg-blue-600 hover:bg-blue-700 text-white px-3.5 py-2 rounded-xl text-xs sm:text-sm font-bold transition-all shadow-sm flex items-center gap-1.5 hover:shadow"
            >
              <Droplets className="w-4 h-4" />
              Programar Água
            </button>

            {/* Botão Nova Tarefa */}
            <button
              onClick={handleOpenCreateModal}
              className="bg-green-600 hover:bg-green-700 text-white px-3.5 py-2 rounded-xl text-xs sm:text-sm font-bold transition-all shadow-sm flex items-center gap-1.5 hover:shadow"
            >
              <Plus className="w-4 h-4" />
              Nova Tarefa
            </button>
          </div>
        )}
      </div>

      {/* Card de Progresso do Dia */}
      <div className="bg-gradient-to-br from-white to-slate-50 p-6 rounded-2xl shadow-sm border border-gray-100 flex flex-col md:flex-row items-center justify-between gap-6">
        <div className="flex-1 w-full space-y-3">
          <div className="flex items-center justify-between">
            <div>
              <span className="text-xs font-bold uppercase tracking-wider text-green-700 bg-green-50 px-2.5 py-1 rounded-md">
                Progresso de Hoje
              </span>
              <h3 className="text-xl font-bold text-gray-800 mt-1">
                {percentualConclusao === 100 && totalTarefas > 0
                  ? '🎉 Parabéns! Rotina 100% concluída!'
                  : `${tarefasConcluidas} de ${totalTarefas} hábitos concluídos`}
              </h3>
            </div>
            <div className="text-right">
              <span className="text-3xl font-black text-green-600">{percentualConclusao}%</span>
            </div>
          </div>

          {/* Barra de Progresso Suave */}
          <div className="w-full h-3 bg-gray-100 rounded-full overflow-hidden p-0.5">
            <div 
              className="h-full bg-gradient-to-r from-teal-500 to-green-500 rounded-full transition-all duration-500 ease-out"
              style={{ width: `${percentualConclusao}%` }}
            />
          </div>

          {/* Mini Indicadores por Categoria */}
          <div className="grid grid-cols-2 sm:grid-cols-4 gap-2 pt-2">
            <div className="bg-blue-50/70 p-2 rounded-xl flex items-center gap-2 border border-blue-100/50">
              <Droplets className="w-4 h-4 text-blue-600 shrink-0" />
              <div className="min-w-0">
                <p className="text-[10px] text-gray-500 font-medium">Hidratação</p>
                <p className="text-xs font-bold text-blue-900">{aguaConcluida}/{itensAgua.length} copos</p>
              </div>
            </div>

            <div className="bg-green-50/70 p-2 rounded-xl flex items-center gap-2 border border-green-100/50">
              <Utensils className="w-4 h-4 text-green-600 shrink-0" />
              <div className="min-w-0">
                <p className="text-[10px] text-gray-500 font-medium">Refeições</p>
                <p className="text-xs font-bold text-green-900">
                  {itens.filter(i => i.categoria === 'refeicao' && !!conclusoesHoje[i.id]).length}/
                  {itens.filter(i => i.categoria === 'refeicao').length} feitas
                </p>
              </div>
            </div>

            <div className="bg-purple-50/70 p-2 rounded-xl flex items-center gap-2 border border-purple-100/50">
              <Pill className="w-4 h-4 text-purple-600 shrink-0" />
              <div className="min-w-0">
                <p className="text-[10px] text-gray-500 font-medium">Suplementação</p>
                <p className="text-xs font-bold text-purple-900">
                  {itens.filter(i => i.categoria === 'suplemento' && !!conclusoesHoje[i.id]).length}/
                  {itens.filter(i => i.categoria === 'suplemento').length} tomados
                </p>
              </div>
            </div>

            <div className="bg-amber-50/70 p-2 rounded-xl flex items-center gap-2 border border-amber-100/50">
              <Dumbbell className="w-4 h-4 text-amber-600 shrink-0" />
              <div className="min-w-0">
                <p className="text-[10px] text-gray-500 font-medium">Atividade</p>
                <p className="text-xs font-bold text-amber-900">
                  {itens.filter(i => i.categoria === 'exercicio' && !!conclusoesHoje[i.id]).length}/
                  {itens.filter(i => i.categoria === 'exercicio').length} cumpridas
                </p>
              </div>
            </div>
          </div>
        </div>
      </div>

      {/* Barra de Filtros */}
      <div className="flex items-center gap-2 overflow-x-auto pb-1 scrollbar-none">
        <button
          onClick={() => setActiveFilter('todas')}
          className={`px-3.5 py-1.5 rounded-full text-xs font-bold whitespace-nowrap transition-colors ${
            activeFilter === 'todas'
              ? 'bg-gray-800 text-white'
              : 'bg-white text-gray-600 hover:bg-gray-100 border border-gray-200'
          }`}
        >
          Todas ({itens.length})
        </button>
        {Object.values(ROUTINE_CATEGORIES).map(cat => {
          const Icon = cat.icon;
          const count = itens.filter(i => i.categoria === cat.id).length;
          return (
            <button
              key={cat.id}
              onClick={() => setActiveFilter(cat.id)}
              className={`px-3.5 py-1.5 rounded-full text-xs font-bold whitespace-nowrap transition-colors flex items-center gap-1.5 ${
                activeFilter === cat.id
                  ? 'bg-green-600 text-white'
                  : 'bg-white text-gray-600 hover:bg-gray-100 border border-gray-200'
              }`}
            >
              <Icon className="w-3.5 h-3.5" />
              {cat.shortLabel} ({count})
            </button>
          );
        })}
      </div>

      {/* Lista do Checklist */}
