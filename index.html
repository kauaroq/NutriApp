// 3.5 Visão de Consultas (Admin)
const AdminConsultasView = ({ currentUser, onOpenConsultaChat }) => {
  const [consultas, setConsultas] = useState([]);
  const [loading, setLoading] = useState(true);

  React.useEffect(() => {
    const q = query(ref(db, 'consultas'));
    const unsubscribe = onValue(q, (snapshot) => {
      const lista = [];
      snapshot.forEach(child => {
        lista.push({ id: child.key, ...child.val() });
      });
      lista.sort((a, b) => b.timestamp - a.timestamp);
      setConsultas(lista);
      setLoading(false);
    });
    return () => unsubscribe();
  }, []);

  const handleAprovar = async (id) => {
    try {
      await update(ref(db, `consultas/${id}`), { status: 'Aprovado' });
      notify.success("Consulta aprovada com sucesso!", "Consulta Aprovada");
    } catch(err) {
      console.error(err);
      notify.error("Erro ao aprovar consulta.");
    }
  };

  return (
    <div className="p-6">
      <h2 className="text-2xl font-bold text-gray-800 mb-6">Requisições de Consultas</h2>
      <div className="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
        {loading ? (
          <div className="p-10 flex flex-col items-center justify-center text-green-600">
            <Loader2 className="w-8 h-8 animate-spin mb-2" />
            <p className="text-gray-500 font-medium">Carregando consultas...</p>
          </div>
        ) : consultas.length === 0 ? (
          <div className="p-10 text-center text-gray-500">
            <CalendarDays className="w-12 h-12 text-gray-300 mx-auto mb-3" />
            <p>Nenhuma requisição de consulta encontrada.</p>
          </div>
        ) : (
          <div className="divide-y divide-gray-100">
            {consultas.map(c => (
              <div key={c.id} className={`p-6 flex flex-col md:flex-row justify-between items-start md:items-center hover:bg-gray-50 transition-colors ${c.status === 'Aprovado' ? 'bg-green-50/30' : ''}`}>
                <div className="mb-4 md:mb-0">
                  <h4 className="text-lg font-semibold text-gray-800">{c.pacienteNome || 'Paciente'}</h4>
                  <div className="flex items-center text-gray-600 mt-1 gap-4">
                    <span className="flex items-center"><CalendarDays className="w-4 h-4 mr-1"/> {(c.data || '').split('-').reverse().join('/')}</span>
                    <span className="flex items-center"><Clock className="w-4 h-4 mr-1"/> {c.hora}</span>
                  </div>
                  {c.observacoes && <p className="text-sm text-gray-500 mt-2 italic">"{c.observacoes}"</p>}
                </div>
                <div className="flex items-center gap-3 w-full md:w-auto">
                  <span className={`px-3 py-1 rounded-full text-xs font-bold border ${c.status === 'Aprovado' ? 'bg-green-100 text-green-700 border-green-200' : 'bg-yellow-100 text-yellow-700 border-yellow-200'}`}>
                    {c.status}
                  </span>
                  {c.status === 'Pendente' && (
                    <button onClick={() => handleAprovar(c.id)} className="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition-colors flex items-center">
                      <Check className="w-4 h-4 mr-1" /> Aprovar
                    </button>
                  )}
                  {c.status === 'Aprovado' && (
                    <button onClick={() => onOpenConsultaChat(c)} className="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition-colors flex items-center">
                      <MessageCircle className="w-4 h-4 mr-1" /> Chat da Consulta
                    </button>
                  )}
                </div>
              </div>
            ))}
          </div>
        )}
      </div>
    </div>
  );
};

// 4. Tela de Autenticação (Login / Cadastro)
const AuthView = () => {
  const [isLogin, setIsLogin] = useState(true);
  const [email, setEmail] = useState('');
  const [password, setPassword] = useState('');
  const [nome, setNome] = useState('');
  const [accountType, setAccountType] = useState('paciente'); // 'paciente' ou 'nutricionista'
  const [codigoNutri, setCodigoNutri] = useState('');
  const [error, setError] = useState('');
  const [loading, setLoading] = useState(false);

  const CODIGO_NUTRICIONISTA = '290965';

  const handleAuth = async (e) => {
    e.preventDefault();
    setError('');
    setLoading(true);

    try {
      if (isLogin) {
        await signInWithEmailAndPassword(auth, email, password);
      } else {
        // Validação do código para nutricionista
        if (accountType === 'nutricionista' && codigoNutri !== CODIGO_NUTRICIONISTA) {
          setError('Código de acesso para nutricionista inválido.');
          setLoading(false);
          return;
        }

        const userCredential = await createUserWithEmailAndPassword(auth, email, password);
        // Cria o registro do usuário no Firestore com o role correto
        const userData = {
          email: email,
          nome: nome,
          role: accountType, // 'paciente' ou 'nutricionista'
          telefone: '',
          dataCadastro: new Date().toISOString()
        };

        // Campos extras para pacientes
        if (accountType === 'paciente') {
          userData.peso = '';
          userData.planoAtivo = false;
          userData.proximaConsulta = '';
        }

        await set(ref(db, `users/${userCredential.user.uid}`), userData);
      }
    } catch (err) {
      console.error(err);
      // Tratamento de erros amigável
      if (err.code === 'auth/invalid-credential' || err.code === 'auth/user-not-found' || err.code === 'auth/wrong-password') {
        setError('Email ou senha incorretos.');
      } else if (err.code === 'auth/email-already-in-use') {
        setError('Este email já está em uso.');
      } else if (err.code === 'auth/weak-password') {
        setError('A senha deve ter pelo menos 6 caracteres.');
      } else {
        setError('Ocorreu um erro. Tente novamente.');
      }
    } finally {
      setLoading(false);
    }
  };

  return (
    <div className="flex h-screen bg-gradient-to-br from-green-50 via-white to-emerald-50 items-center justify-center p-4">
      <div className="max-w-md w-full bg-white rounded-2xl shadow-xl p-8 border border-gray-100">
        <div className="flex justify-center mb-6">
          <div className="flex items-center space-x-2 text-green-600">
            <Utensils className="w-8 h-8" />
            <span className="text-3xl font-bold text-gray-800 tracking-tight">Nutri<span className="text-green-600">App</span></span>
          </div>
        </div>
        
        <h2 className="text-2xl font-bold text-center text-gray-800 mb-2">
          {isLogin ? 'Entrar no sistema' : 'Criar nova conta'}
        </h2>
        {!isLogin && (
          <p className="text-center text-sm text-gray-500 mb-6">Selecione o tipo de conta para continuar</p>
        )}
        {isLogin && <div className="mb-6" />}

        {error && (
          <div className="mb-4 p-3 bg-red-50 border-l-4 border-red-500 text-red-700 text-sm rounded flex items-start gap-2">
            <AlertCircle className="w-4 h-4 mt-0.5 shrink-0" />
            <span>{error}</span>
          </div>
        )}

        <form onSubmit={handleAuth} className="space-y-5">
          {/* Seleção de Tipo de Conta (apenas no Cadastro) */}
          {!isLogin && (
            <div>
              <label className="block text-sm font-medium text-gray-700 mb-2">Tipo de Conta</label>
              <div className="grid grid-cols-2 gap-3">
                <button
                  type="button"
                  onClick={() => { setAccountType('paciente'); setCodigoNutri(''); setError(''); }}
                  className={`flex flex-col items-center p-4 rounded-xl border-2 transition-all duration-200 ${
                    accountType === 'paciente'
                      ? 'border-green-500 bg-green-50 text-green-700 shadow-sm'
                      : 'border-gray-200 text-gray-500 hover:border-gray-300 hover:bg-gray-50'
                  }`}
                >
                  <Users className={`w-6 h-6 mb-1.5 ${accountType === 'paciente' ? 'text-green-600' : 'text-gray-400'}`} />
                  <span className="text-sm font-semibold">Paciente</span>
                </button>
                <button
                  type="button"
                  onClick={() => { setAccountType('nutricionista'); setError(''); }}
                  className={`flex flex-col items-center p-4 rounded-xl border-2 transition-all duration-200 ${
                    accountType === 'nutricionista'
                      ? 'border-emerald-500 bg-emerald-50 text-emerald-700 shadow-sm'
                      : 'border-gray-200 text-gray-500 hover:border-gray-300 hover:bg-gray-50'
                  }`}
                >
                  <Utensils className={`w-6 h-6 mb-1.5 ${accountType === 'nutricionista' ? 'text-emerald-600' : 'text-gray-400'}`} />
                  <span className="text-sm font-semibold">Nutricionista</span>
                </button>
              </div>
            </div>
          )}

          {/* Campo Nome (apenas no Cadastro) */}
          {!isLogin && (
            <div>
              <label className="block text-sm font-medium text-gray-700 mb-1">Nome Completo</label>
              <input 
                type="text" 
                value={nome}
                onChange={(e) => setNome(e.target.value)}
                required
                className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-green-500 outline-none transition-all"
                placeholder="Seu nome completo"
              />
            </div>
          )}

          <div>
            <label className="block text-sm font-medium text-gray-700 mb-1">Email</label>
            <input 
              type="email" 
              value={email}
              onChange={(e) => setEmail(e.target.value)}
              required
              className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-green-500 outline-none transition-all"
              placeholder="seu@email.com"
            />
          </div>
          
          <div>
            <label className="block text-sm font-medium text-gray-700 mb-1">Senha</label>
            <input 
              type="password" 
              value={password}
              onChange={(e) => setPassword(e.target.value)}
              required
              className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-green-500 outline-none transition-all"
              placeholder="••••••••"
            />
          </div>

          {/* Campo de Código (apenas para Nutricionista no Cadastro) */}
          {(!isLogin && accountType === 'nutricionista') && (
            <div>
              <label className="block text-sm font-medium text-gray-700 mb-1">Código de Acesso</label>
              <input 
                type="password" 
                value={codigoNutri}
                onChange={(e) => setCodigoNutri(e.target.value)}
                required
                className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none transition-all"
                placeholder="Insira o código fornecido"
              />
              <p className="text-xs text-gray-400 mt-1">Código necessário para criar conta de nutricionista.</p>
            </div>
          )}

          <button 
            type="submit" 
            disabled={loading}
            className="w-full bg-green-600 hover:bg-green-700 text-white font-medium py-2.5 rounded-lg transition-colors flex justify-center items-center shadow-sm"
          >
            {loading ? <Loader2 className="w-5 h-5 animate-spin" /> : (isLogin ? 'Entrar' : 'Cadastrar')}
          </button>
        </form>

        <div className="mt-6 text-center">
          <button 
            type="button"
            onClick={() => { setIsLogin(!isLogin); setError(''); setAccountType('paciente'); setCodigoNutri(''); }}
            className="text-sm text-green-600 hover:text-green-700 font-medium transition-colors"
          >
            {isLogin ? 'Não tem uma conta? Cadastre-se' : 'Já tem uma conta? Entre aqui'}
          </button>
        </div>
      </div>
    </div>
  );
};

// ==========================================
// COMPONENTE PRINCIPAL (APP)
// ==========================================

function App() {
  const [activeTab, setActiveTab] = useState('dashboard');
  const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);
  
  const [showNotifications, setShowNotifications] = useState(false);

  // Estado para chat da nutricionista (paciente selecionado)
  const [chatPaciente, setChatPaciente] = useState(null);

  // Estado para chat de consulta aprovada (Admin ou Paciente)
  const [chatConsultaAtiva, setChatConsultaAtiva] = useState(null);

  // Estado para ficha do paciente (Admin visualizando)
  const [fichaPaciente, setFichaPaciente] = useState(null);

  // Estado para visualização da rotina do paciente pela Nutricionista
  const [rotinaPaciente, setRotinaPaciente] = useState(null);

  // Estados de Autenticação
  const [user, setUser] = useState(null);
  const [userData, setUserData] = useState(null); // Dados do Firestore (inclui role)
  const [authLoading, setAuthLoading] = useState(true);
  const [unreadChats, setUnreadChats] = useState({});

  // Lembretes da rotina e conclusões do dia
  const [routineReminders, setRoutineReminders] = useState([]);
  const [todayCompletions, setTodayCompletions] = useState({});

  React.useEffect(() => {
    if (!user) return;
    const unreadRef = ref(db, `unreadMessages/${user.uid}`);
    const unsubscribe = onValue(unreadRef, (snap) => {
      if (snap.exists()) setUnreadChats(snap.val());
      else setUnreadChats({});
    });
    return () => unsubscribe();
  }, [user]);

  // Escuta os lembretes da rotina do usuário logado e as conclusões de hoje
  React.useEffect(() => {
    if (!user) {
      setRoutineReminders([]);
      setTodayCompletions({});
      return;
    }

    const d = new Date();
    const todayKey = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;

    const rotinaRef = ref(db, `rotinas/${user.uid}/itens`);
    const unsubRotina = onValue(rotinaRef, (snap) => {
      if (snap.exists()) {
        const val = snap.val();
        const lista = Object.entries(val).map(([k, v]) => ({ id: k, ...v }));
        lista.sort((a, b) => (a.horario || '00:00').localeCompare(b.horario || '00:00'));
        // Filtra os itens com aviso/notificação ativada
        setRoutineReminders(lista.filter(i => i.lembrete !== false));
      } else {
        setRoutineReminders([]);
      }
    });

    const conclRef = ref(db, `rotinas/${user.uid}/conclusoes/${todayKey}`);
    const unsubConcl = onValue(conclRef, (snap) => {
      if (snap.exists()) {
        setTodayCompletions(snap.val());
      } else {
        setTodayCompletions({});
      }
    });

    return () => {
      unsubRotina();
      unsubConcl();
    };
  }, [user]);

  // Checagem em tempo real de avisos programados (notificações nativas do navegador)
  React.useEffect(() => {
    if (!user || routineReminders.length === 0) return;

    const checkAlarms = () => {
      const now = new Date();
      const currentHHMM = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
      
      routineReminders.forEach(item => {
        if (item.lembrete && item.horario === currentHHMM && !todayCompletions[item.id]) {
          const firedKey = `notif_fired_${user.uid}_${item.id}_${now.toDateString()}_${currentHHMM}`;
          if (!sessionStorage.getItem(firedKey)) {
            sessionStorage.setItem(firedKey, '1');
            if (typeof window !== 'undefined' && 'Notification' in window && Notification.permission === 'granted') {
              try {
                new Notification(`NutriApp: ${item.titulo}`, {
                  body: item.observacao ? `${item.observacao} (${item.horario})` : `Lembrete da sua rotina agendado para ${item.horario}`,
                  icon: 'https://cdn-icons-png.flaticon.com/512/3100/3100566.png'
                });
              } catch(err) {
                console.warn("Erro ao exibir notificação web:", err);
              }
            }
          }
        }
      });
    };

    const interval = setInterval(checkAlarms, 30000);
    checkAlarms();
    return () => clearInterval(interval);
  }, [user, routineReminders, todayCompletions]);

  // Efeito para escutar mudanças de estado do usuário do Firebase
  React.useEffect(() => {
    const unsubscribe = onAuthStateChanged(auth, async (currentUser) => {
      setUser(currentUser);
      if (currentUser) {
        // Busca os dados do usuário no Realtime Database para pegar o role
        try {
          const userSnapshot = await get(ref(db, `users/${currentUser.uid}`));
          if (userSnapshot.exists()) {
            setUserData(userSnapshot.val());
          } else {
            // Fallback para contas antigas sem documento no Firestore
            setUserData({ email: currentUser.email, role: 'paciente', nome: '' });
          }
        } catch (error) {
          console.error('Erro ao buscar dados do usuário:', error);
          setUserData({ email: currentUser.email, role: 'paciente', nome: '' });
        }
      } else {
        setUserData(null);
      }
      setAuthLoading(false);
    });
    return () => unsubscribe();
  }, []);

  const handleLogout = async () => {
    try {
      await signOut(auth);
    } catch (error) {
      console.error("Erro ao sair:", error);
    }
  };

  // Alternar conclusão de item da rotina diretamente pelo dropdown de notificações
  const handleToggleNotificationCheck = async (itemId, isCurrentlyDone) => {
    if (!user) return;
    const d = new Date();
    const todayKey = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    try {
      if (isCurrentlyDone) {
        await remove(ref(db, `rotinas/${user.uid}/conclusoes/${todayKey}/${itemId}`));
      } else {
        await set(ref(db, `rotinas/${user.uid}/conclusoes/${todayKey}/${itemId}`), true);
      }
    } catch (err) {
      console.error("Erro ao alterar status da rotina no aviso:", err);
    }
  };

  // Função para deletar um paciente por completo (exclusivo para nutricionista)
  const handleDeletePaciente = async (paciente) => {
    if (!isAdmin || !paciente?.id) return false;
    const nome = paciente.nome || paciente.email || 'este paciente';
    const confirmed = await showConfirm({
      title: "Excluir Paciente",
      message: `Tem certeza que deseja excluir o paciente "${nome}"? Esta ação é definitiva e removerá permanentemente o cadastro, a ficha de anamnese, todas as planilhas do plano alimentar, tarefas de rotina, histórico de conversas e consultas vinculadas.`,
      confirmText: "Sim, Excluir Paciente",
      cancelText: "Cancelar",
      variant: "danger"
    });

    if (!confirmed) return false;

    try {
      const pacienteId = paciente.id;

      // 1. Limpar consultas e chats de consultas associados
      try {
        const qConsultas = query(ref(db, 'consultas'), orderByChild('pacienteId'), equalTo(pacienteId));
        const snapConsultas = await get(qConsultas);
        if (snapConsultas.exists()) {
          const promises = [];
          snapConsultas.forEach((child) => {
            promises.push(remove(ref(db, `consultas/${child.key}`)));
            promises.push(remove(ref(db, `chats/consulta_${child.key}`)));
          });
          await Promise.all(promises);
        }
      } catch (errConsultas) {
        console.warn("Erro ao limpar consultas vinculadas:", errConsultas);
      }

      // 2. Limpar chat geral direto e notificações não lidas
      try {
        if (user?.uid) {
          const directChatId = [user.uid, pacienteId].sort().join('_');
          await remove(ref(db, `chats/${directChatId}`));
          await remove(ref(db, `unreadMessages/${user.uid}/${directChatId}`));
        }
        await remove(ref(db, `unreadMessages/${pacienteId}`));
      } catch (errChat) {
        console.warn("Erro ao limpar chats:", errChat);
      }

      // 3. Limpar planos alimentares e planilhas
      try {
        await remove(ref(db, `planos/${pacienteId}`));
      } catch (errPlanos) {
        console.warn("Erro ao limpar planos:", errPlanos);
      }

      // 4. Limpar rotina e hábitos
      try {
        await remove(ref(db, `rotinas/${pacienteId}`));
      } catch (errRotina) {
        console.warn("Erro ao limpar rotina:", errRotina);
      }

      // 5. Limpar ficha médica completa (anamnese)
      try {
        await remove(ref(db, `fichas/${pacienteId}`));
      } catch (errFicha) {
        console.warn("Erro ao limpar ficha:", errFicha);
      }

      // 6. Remover registro do usuário no banco
      await remove(ref(db, `users/${pacienteId}`));

      // Se havia telas abertas com este paciente, fechar
      if (fichaPaciente?.id === pacienteId) setFichaPaciente(null);
      if (rotinaPaciente?.id === pacienteId) setRotinaPaciente(null);
      if (chatPaciente?.id === pacienteId) setChatPaciente(null);

      notify.success(`Paciente "${nome}" foi excluído com sucesso!`, "Exclusão Concluída");
      return true;
    } catch (error) {
      console.error("Erro ao excluir paciente:", error);
      notify.error(`Não foi possível excluir o paciente: ${error.message}`);
      return false;
    }
  };

  // Definição do menu lateral baseado no perfil
  const adminMenuItems = [
    { id: 'dashboard', label: 'Dashboard', icon: Home },
    { id: 'pacientes', label: 'Pacientes', icon: Users },
    { id: 'consultas', label: 'Consultas', icon: CalendarDays },
    { id: 'dietas', label: 'Planos Alimentares', icon: Utensils },
    { id: 'configuracoes', label: 'Configurações', icon: Settings },
  ];

  const patientMenuItems = [
    { id: 'dashboard', label: 'Início', icon: Home },
    { id: 'rotina', label: 'Minha Rotina', icon: ListTodo },
    { id: 'plano', label: 'Meu Plano', icon: Apple },
    { id: 'ficha', label: 'Ficha Completa', icon: FileText },
    { id: 'agendamento', label: 'Consultas', icon: CalendarDays },
    { id: 'chat', label: 'Chat Geral', icon: MessageCircle },
  ];

  // Verifica se o utilizador atual é nutricionista pelo role salvo no Firestore
  const isAdmin = userData?.role === 'nutricionista';

  // Define qual menu mostrar
  const menuItems = isAdmin ? adminMenuItems : patientMenuItems;

  // Renderiza o conteúdo principal com base na aba ativa e no perfil
  const renderContent = () => {
    if (fichaPaciente) {
      return (
        <div className="p-6">
          <div className="flex items-center justify-between mb-4">
            <button 
              onClick={() => setFichaPaciente(null)}
              className="flex items-center gap-2 text-gray-600 hover:text-gray-800 transition-colors text-sm font-medium"
            >
              <X className="w-4 h-4" />
              Voltar para Pacientes
            </button>
            {isAdmin && (
              <button
                onClick={() => handleDeletePaciente(fichaPaciente)}
                className="flex items-center gap-1.5 text-sm font-medium text-red-600 hover:text-red-700 bg-red-50 hover:bg-red-100 px-3 py-1.5 rounded-lg border border-red-200 transition-colors"
                title="Excluir este paciente e todos os seus dados"
              >
                <Trash2 className="w-4 h-4" />
                Excluir Paciente
              </button>
            )}
          </div>
          <PatientFichaView currentUser={{ uid: fichaPaciente.id, readOnly: true }} />
        </div>
      );
    }

    if (rotinaPaciente) {
      return (
        <div className="p-6">
          <div className="flex items-center justify-between mb-4">
            <button 
              onClick={() => setRotinaPaciente(null)}
              className="flex items-center gap-2 text-gray-600 hover:text-gray-800 transition-colors text-sm font-medium"
            >
              <X className="w-4 h-4" />
              Voltar para Pacientes
            </button>
            {isAdmin && (
              <button
                onClick={() => handleDeletePaciente(rotinaPaciente)}
                className="flex items-center gap-1.5 text-sm font-medium text-red-600 hover:text-red-700 bg-red-50 hover:bg-red-100 px-3 py-1.5 rounded-lg border border-red-200 transition-colors"
                title="Excluir este paciente e todos os seus dados"
              >
                <Trash2 className="w-4 h-4" />
                Excluir Paciente
              </button>
            )}
          </div>
          <PatientRoutineView currentUser={{ uid: rotinaPaciente.id }} pacienteNome={rotinaPaciente.nome || rotinaPaciente.email} readOnly={true} />
        </div>
      );
    }

    if (chatConsultaAtiva) {
      return (
        <div className="p-6">
          <button 
            onClick={() => setChatConsultaAtiva(null)}
            className="mb-4 flex items-center gap-2 text-gray-600 hover:text-gray-800 transition-colors text-sm font-medium"
          >
            <X className="w-4 h-4" />
            Voltar para {isAdmin ? 'Consultas' : 'Agendamentos'}
          </button>
          <ChatComponent
            currentUserId={user.uid}
            otherUserId={isAdmin ? chatConsultaAtiva.pacienteId : 'admin_nutri'} // Para simplificar
            otherUserName={isAdmin ? chatConsultaAtiva.pacienteNome : 'Nutricionista (Consulta)'}
            otherUserInitials={isAdmin ? (chatConsultaAtiva.pacienteNome || 'P').charAt(0).toUpperCase() : 'NC'}
            isAdmin={isAdmin}
            customChatId={`consulta_${chatConsultaAtiva.id}`}
            isConsultaInfo={`${chatConsultaAtiva.data.split('-').reverse().join('/')} às ${chatConsultaAtiva.hora} ${chatConsultaAtiva.observacoes ? '- '+chatConsultaAtiva.observacoes : ''}`}
          />
        </div>
      );
    }

    // Se for a Nutricionista, mostra as telas de admin
    if (isAdmin) {
      // Se há um paciente selecionado para chat, mostrar o chat
      if (chatPaciente) {
        return <AdminChatView currentUser={user} paciente={chatPaciente} onBack={() => { setChatPaciente(null); setActiveTab('pacientes'); }} />;
      }
      switch (activeTab) {
        case 'dashboard': return <DashboardView isAdmin={true} currentUser={user} />;
        case 'pacientes': return <PacientesView isAdmin={true} onOpenChat={(paciente) => { setChatPaciente(paciente); setActiveTab('chat_admin'); }} onOpenFicha={(paciente) => setFichaPaciente(paciente)} onOpenRotina={(paciente) => setRotinaPaciente(paciente)} currentUserId={user.uid} unreadChats={unreadChats} onDeletePaciente={handleDeletePaciente} />;
        case 'consultas': return <AdminConsultasView currentUser={user} onOpenConsultaChat={(c) => setChatConsultaAtiva(c)} />;
        case 'dietas': return <AdminDietasView currentUser={user} />;
        case 'configuracoes': return <AdminConfiguracoesView currentUser={user} />;
        default: return <DashboardView isAdmin={true} currentUser={user} />;
      }
    } 
    
    // Se for Paciente, mostra as telas de paciente
    switch (activeTab) {
      case 'dashboard': return <DashboardView isAdmin={false} currentUser={user} onNavigate={setActiveTab} />;
      case 'rotina': return <PatientRoutineView currentUser={user} onNavigate={setActiveTab} />;
      case 'plano': return <PatientMealPlanView currentUser={user} />;
      case 'ficha': return <PatientFichaView currentUser={user} />;
      case 'agendamento': return <PatientScheduleView currentUser={{...user, onOpenConsultaChat: (c) => setChatConsultaAtiva(c)}} />;
      case 'chat': return <PatientChatView currentUser={user} />;
      default: return <DashboardView isAdmin={false} currentUser={user} onNavigate={setActiveTab} />;
    }
  };

  // Se ainda estiver validando o token de login
  if (authLoading) {
    return (
      <div className="h-screen w-screen flex items-center justify-center bg-gray-50">
        <Loader2 className="w-8 h-8 text-green-600 animate-spin" />
      </div>
    );
  }

  // Se o usuário não estiver logado, exibe a tela de Login
  if (!user) {
    return <AuthView />;
  }

  return (
    <div className="flex h-screen bg-gray-50 font-sans">
      
      {/* Sidebar - Desktop */}
      <aside className="hidden md:flex flex-col w-64 bg-white border-r border-gray-200">
        <div className="p-6 flex items-center space-x-3 text-green-600">
          <Utensils className="w-8 h-8" />
          <span className="text-2xl font-bold text-gray-800 tracking-tight">Nutri<span className="text-green-600">App</span></span>
        </div>
        
        <nav className="flex-1 px-4 py-4 space-y-1">
          {menuItems.map((item) => (
            <button
              key={item.id}
              onClick={() => {
                setActiveTab(item.id);
                setFichaPaciente(null);
                setRotinaPaciente(null);
                setChatPaciente(null);
                setChatConsultaAtiva(null);
              }}
              className={`w-full flex items-center space-x-3 px-4 py-3 rounded-lg transition-colors ${
                activeTab === item.id 
                  ? 'bg-green-50 text-green-700 font-medium' 
                  : 'text-gray-600 hover:bg-gray-50 hover:text-gray-900'
              }`}
            >
              <item.icon className={`w-5 h-5 ${activeTab === item.id ? 'text-green-600' : 'text-gray-400'}`} />
              <span>{item.label}</span>
            </button>
          ))}
        </nav>

        {/* Perfil Mini na Sidebar */}
        <div className="p-4 border-t border-gray-200">
          <div className="flex items-center justify-between">
            <div className="flex items-center space-x-3 overflow-hidden">
              <div className="w-10 h-10 rounded-full bg-green-200 flex items-center justify-center text-green-700 font-bold shrink-0">
                {user.email ? user.email.charAt(0).toUpperCase() : 'U'}
              </div>
              <div className="truncate">
                <p className="text-sm font-medium text-gray-800 truncate" title={userData?.nome || user.email}>
                  {userData?.nome || user.email}
                </p>
                <p className="text-xs text-gray-500">{isAdmin ? 'Nutricionista' : 'Paciente'}</p>
              </div>
            </div>
            <button 
              onClick={handleLogout}
              className="p-2 text-gray-400 hover:text-red-600 transition-colors"
              title="Sair"
            >
              <LogOut className="w-5 h-5" />
            </button>
          </div>
        </div>
      </aside>

      {/* Sidebar - Mobile (Overlay) */}
      {isMobileMenuOpen && (
        <div className="fixed inset-0 z-50 flex md:hidden">
          <div className="fixed inset-0 bg-gray-800 bg-opacity-50" onClick={() => setIsMobileMenuOpen(false)}></div>
          <aside className="relative flex flex-col w-64 bg-white h-full shadow-xl">
            <div className="p-6 flex justify-between items-center border-b border-gray-200">
              <div className="flex items-center space-x-2 text-green-600">
                <Utensils className="w-6 h-6" />
                <span className="text-xl font-bold text-gray-800">Nutri<span className="text-green-600">App</span></span>
              </div>
              <button onClick={() => setIsMobileMenuOpen(false)} className="text-gray-500">
                <X className="w-6 h-6" />
              </button>
            </div>
            <nav className="flex-1 px-4 py-4 space-y-2">
              {menuItems.map((item) => (
                <button
                  key={item.id}
                  onClick={() => {
                    setActiveTab(item.id);
                    setFichaPaciente(null);
                    setRotinaPaciente(null);
                    setChatPaciente(null);
                    setChatConsultaAtiva(null);
                    setIsMobileMenuOpen(false);
                  }}
                  className={`w-full flex items-center space-x-3 px-4 py-3 rounded-lg ${
                    activeTab === item.id ? 'bg-green-50 text-green-700 font-medium' : 'text-gray-600'
                  }`}
                >
                  <item.icon className="w-5 h-5" />
                  <span>{item.label}</span>
                </button>
              ))}
              
              <div className="pt-4 mt-4 border-t border-gray-100">
                <button
                  onClick={handleLogout}
                  className="w-full flex items-center space-x-3 px-4 py-3 rounded-lg text-red-600 hover:bg-red-50 transition-colors font-medium"
                >
                  <LogOut className="w-5 h-5" />
                  <span>Sair do sistema</span>
                </button>
              </div>
            </nav>
          </aside>
        </div>
      )}

      {/* Conteúdo Principal */}
      <main className="flex-1 flex flex-col h-screen overflow-hidden">
        
        {/* Top Header */}
        <header className="bg-white border-b border-gray-200 h-16 flex items-center justify-between px-4 sm:px-6 z-10">
          <div className="flex items-center">
            <button 
              className="md:hidden p-2 -ml-2 mr-2 text-gray-600 hover:bg-gray-100 rounded-lg"
              onClick={() => setIsMobileMenuOpen(true)}
            >
              <Menu className="w-6 h-6" />
            </button>
            
            {/* Barra de Busca (Visual) */}
            <div className="hidden sm:flex items-center bg-gray-100 px-3 py-2 rounded-lg focus-within:ring-2 focus-within:ring-green-500 transition-all">
              <Search className="w-4 h-4 text-gray-400 mr-2" />
              <input 
                type="text" 
                placeholder="Buscar paciente..." 
                className="bg-transparent border-none focus:outline-none text-sm text-gray-700 w-64"
              />
            </div>
          </div>

          <div className="flex items-center space-x-4">
            <div className="relative">
              {(() => {
                const pendingRemindersCount = routineReminders.filter(i => !todayCompletions[i.id]).length;
                const totalNotifCount = Object.keys(unreadChats).length + pendingRemindersCount;

                return (
                  <>
                    <button 
                      onClick={() => setShowNotifications(!showNotifications)}
                      className="relative p-2 text-gray-400 hover:text-gray-600 transition-colors rounded-xl hover:bg-gray-100"
                      title="Notificações e Avisos"
                    >
                      <Bell className="w-6 h-6" />
                      {totalNotifCount > 0 && (
                        <span className="absolute top-1 right-1 flex items-center justify-center min-w-[18px] h-[18px] px-1 text-[10px] font-extrabold text-white bg-red-500 rounded-full ring-2 ring-white">
                          {totalNotifCount}
                        </span>
                      )}
                    </button>
                    
                    {/* Dropdown de Notificações Reais */}
                    {showNotifications && (
                      <div className="absolute right-0 mt-2 w-80 sm:w-96 bg-white rounded-2xl shadow-xl border border-gray-100 z-50 overflow-hidden animate-in fade-in slide-in-from-top-2 duration-150">
                        <div className="p-3.5 border-b border-gray-100 bg-gradient-to-r from-gray-50 to-slate-50 flex items-center justify-between">
                          <div className="flex items-center gap-2">
                            <Bell className="w-4 h-4 text-green-600" />
                            <span className="font-bold text-gray-800 text-sm">Notificações & Avisos</span>
                          </div>
                          {totalNotifCount > 0 ? (
                            <span className="text-[11px] font-bold bg-green-100 text-green-700 px-2.5 py-0.5 rounded-full">
                              {totalNotifCount} {totalNotifCount > 1 ? 'pendentes' : 'pendente'}
                            </span>
                          ) : (
                            <span className="text-[11px] font-medium text-gray-400">0 pendências</span>
                          )}
                        </div>

                        <div className="max-h-80 overflow-y-auto divide-y divide-gray-100">
                          {/* 1. Mensagens Não Lidas (Reais) */}
                          {Object.keys(unreadChats).length > 0 && (
                            <div 
                              className="p-3.5 hover:bg-blue-50/50 flex items-start gap-3 cursor-pointer transition-colors" 
                              onClick={() => { setActiveTab(isAdmin ? 'pacientes' : 'chat'); setShowNotifications(false); }}
                            >
                              <div className="bg-blue-100 p-2.5 rounded-xl text-blue-600 shrink-0">
                                <MessageCircle className="w-4 h-4" />
                              </div>
                              <div className="flex-1 min-w-0">
                                <p className="text-sm font-semibold text-gray-800">Novas Mensagens</p>
                                <p className="text-xs text-gray-500">Você tem {Object.keys(unreadChats).length} conversa(s) com novas mensagens.</p>
                              </div>
                            </div>
                          )}

                          {/* 2. Lembretes da Rotina do Usuário (Reais) */}
                          {routineReminders.length > 0 && (
                            routineReminders.map(item => {
                              const isDone = !!todayCompletions[item.id];
                              return (
                                <div 
                                  key={item.id} 
                                  className={`p-3.5 flex items-start gap-3 transition-colors ${
                                    isDone ? 'bg-gray-50/60 opacity-60' : 'hover:bg-slate-50'
                                  }`}
                                >
                                  <div className={`p-2 rounded-xl shrink-0 ${
                                    item.categoria === 'agua' ? 'bg-blue-100 text-blue-600' :
                                    item.categoria === 'refeicao' ? 'bg-green-100 text-green-600' :
                                    item.categoria === 'suplemento' ? 'bg-purple-100 text-purple-600' :
                                    item.categoria === 'exercicio' ? 'bg-amber-100 text-amber-600' :
                                    'bg-teal-100 text-teal-600'
                                  }`}>
                                    {item.categoria === 'agua' && <Droplets className="w-4 h-4" />}
                                    {item.categoria === 'refeicao' && <Utensils className="w-4 h-4" />}
                                    {item.categoria === 'suplemento' && <Pill className="w-4 h-4" />}
                                    {item.categoria === 'exercicio' && <Dumbbell className="w-4 h-4" />}
                                    {(!['agua','refeicao','suplemento','exercicio'].includes(item.categoria)) && <Clock className="w-4 h-4" />}
                                  </div>

                                  <div 
                                    className="flex-1 min-w-0 cursor-pointer" 
                                    onClick={() => { setActiveTab('rotina'); setShowNotifications(false); }}
                                  >
                                    <div className="flex items-center gap-1.5">
                                      <span className="text-[10px] font-bold px-1.5 py-0.5 rounded bg-gray-100 text-gray-700">
                                        {item.horario || '--:--'}
                                      </span>
                                      <p className={`text-xs sm:text-sm font-semibold truncate ${isDone ? 'line-through text-gray-400' : 'text-gray-800'}`}>
                                        {item.titulo}
                                      </p>
                                    </div>
                                    {item.observacao && (
                                      <p className="text-[11px] text-gray-500 mt-0.5 truncate">{item.observacao}</p>
                                    )}
                                    <p className={`text-[10px] font-medium mt-1 ${isDone ? 'text-green-600 font-bold' : 'text-amber-600'}`}>
                                      {isDone ? '✓ Concluído hoje' : '• Lembrete ativo para hoje'}
                                    </p>
                                  </div>

                                  <button
                                    type="button"
                                    onClick={(e) => {
                                      e.stopPropagation();
                                      handleToggleNotificationCheck(item.id, isDone);
                                    }}
                                    className={`p-1.5 rounded-lg border text-xs transition-colors shrink-0 ${
                                      isDone 
                                        ? 'bg-green-100 text-green-700 border-green-200' 
                                        : 'hover:bg-green-50 text-gray-400 hover:text-green-600 border-gray-200'
                                    }`}
                                    title={isDone ? "Marcar como pendente" : "Marcar como feito"}
                                  >
                                    <Check className="w-3.5 h-3.5" />
                                  </button>
                                </div>
                              );
                            })
                          )}

                          {/* 3. Estado Vazio se não houver notificações */}
                          {Object.keys(unreadChats).length === 0 && routineReminders.length === 0 && (
                            <div className="p-8 text-center">
                              <div className="w-12 h-12 bg-green-50 rounded-full flex items-center justify-center mx-auto mb-3 text-green-600">
                                <CheckCheck className="w-6 h-6" />
                              </div>
                              <p className="text-sm font-bold text-gray-800">Tudo em dia!</p>
                              <p className="text-xs text-gray-500 mt-1">Nenhum aviso de rotina ou mensagem pendente.</p>
                            </div>
                          )}
                        </div>

                        {!isAdmin && (
                          <div className="p-3 border-t border-gray-100 bg-gray-50 text-center">
                            <button 
                              onClick={() => { setActiveTab('rotina'); setShowNotifications(false); }}
                              className="text-xs font-bold text-green-600 hover:text-green-700 transition-colors inline-flex items-center gap-1"
                            >
                              Personalizar Minha Rotina & Avisos ➔
                            </button>
                          </div>
                        )}
                      </div>
                    )}
                  </>
                );
              })()}
            </div>
          </div>
        </header>

        {/* Área de Scroll do Conteúdo */}
        <div className="flex-1 overflow-auto bg-slate-50/50">
          {renderContent()}
        </div>
        
      </main>
    </div>
  );
}

    const RootApp = () => {
      return (
        <React.Fragment>
          <App />
          <ToastAndConfirmContainer />
        </React.Fragment>
      );
    };

    const root = createRoot(document.getElementById('root'));
    root.render(<RootApp />);
  </script>
</body>
</html>
