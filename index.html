// Helper universal para normalizar listas de planos (suporta formato legado único ou multi-planilhas)
const normalizePlanosList = (rawVal) => {
  if (!rawVal) return [];
  if (Array.isArray(rawVal)) {
    return rawVal
      .filter(item => item && typeof item === 'object')
      .map((item, idx) => ({ id: item.id || `plan_${idx}`, ...item }))
      .sort((a, b) => new Date(b.dataUpload || 0) - new Date(a.dataUpload || 0));
  }
  // Formato legado: objeto único contendo nomeArquivo ou fileDataUrl diretamente
  if (rawVal.nomeArquivo || rawVal.fileDataUrl) {
    return [{
      id: 'legacy',
      ...rawVal
    }];
  }
  // Formato multi-planilhas: objeto dicionário { [id]: { nomeArquivo, ... } }
  if (typeof rawVal === 'object') {
    return Object.entries(rawVal)
      .filter(([_, item]) => item && typeof item === 'object' && (item.nomeArquivo || item.fileDataUrl || item.planoData))
      .map(([key, item]) => ({
        id: key,
        ...item
      }))
      .sort((a, b) => new Date(b.dataUpload || 0) - new Date(a.dataUpload || 0));
  }
  return [];
};

// ==========================================
// SISTEMA DE NOTIFICAÇÕES E CONFIRMAÇÕES NA INTERFACE (TOASTS & MODAIS)
// ==========================================

const feedbackListeners = {
  toast: new Set(),
  confirm: new Set()
};

const notify = {
  toast: (msg, type = 'info', title = null, duration = 4000) => {
    const id = 'toast_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6);
    const toastObj = { 
      id, 
      message: typeof msg === 'object' ? (msg?.message || JSON.stringify(msg)) : String(msg || ''), 
      type, 
      title, 
      duration 
    };
    feedbackListeners.toast.forEach(listener => {
      try { listener(toastObj); } catch(e) { console.error(e); }
    });
    return id;
  },
  success: (msg, title = 'Sucesso!') => notify.toast(msg, 'success', title),
  error: (msg, title = 'Erro') => notify.toast(msg, 'error', title),
  warning: (msg, title = 'Atenção') => notify.toast(msg, 'warning', title),
  info: (msg, title = 'Informação') => notify.toast(msg, 'info', title),
};

const showConfirm = ({
  title = 'Confirmar Ação',
  message = 'Deseja realmente continuar?',
  confirmText = 'Confirmar',
  cancelText = 'Cancelar',
  variant = 'danger' // 'danger' | 'warning' | 'info' | 'primary'
} = {}) => {
  return new Promise((resolve) => {
    const confirmData = {
      title,
      message,
      confirmText,
      cancelText,
      variant,
      resolve: (value) => {
        resolve(Boolean(value));
      }
    };
    feedbackListeners.confirm.forEach(listener => {
      try { listener(confirmData); } catch(e) { console.error(e); }
    });
  });
};

// Exposição global segura e substituição de alertas nativos
window.notify = notify;
window.showConfirm = showConfirm;
window.alert = (msg) => {
  const str = typeof msg === 'object' ? (msg?.message || JSON.stringify(msg)) : String(msg || '');
  if (str.startsWith('✅') || str.startsWith('🎉') || str.startsWith('✨')) {
    notify.success(str);
  } else if (str.toLowerCase().includes('erro') || str.toLowerCase().includes('falha')) {
    notify.error(str);
  } else if (str.toLowerCase().includes('atenção') || str.toLowerCase().includes('preencha')) {
    notify.warning(str);
  } else {
    notify.info(str);
  }
};

const ToastAndConfirmContainer = () => {
  const [toasts, setToasts] = useState([]);
  const [confirmModal, setConfirmModal] = useState(null);

  React.useEffect(() => {
    const handleToast = (newToast) => {
      setToasts(prev => [...prev, newToast]);
      if (newToast.duration > 0) {
        setTimeout(() => {
          setToasts(prev => prev.filter(t => t.id !== newToast.id));
        }, newToast.duration);
      }
    };

    const handleConfirm = (data) => {
      setConfirmModal(data);
    };

    feedbackListeners.toast.add(handleToast);
    feedbackListeners.confirm.add(handleConfirm);

    const handleKeyDown = (e) => {
      if (e.key === 'Escape' && confirmModal) {
        confirmModal.resolve(false);
        setConfirmModal(null);
      }
    };
    window.addEventListener('keydown', handleKeyDown);

    return () => {
      feedbackListeners.toast.delete(handleToast);
      feedbackListeners.confirm.delete(handleConfirm);
      window.removeEventListener('keydown', handleKeyDown);
    };
  }, [confirmModal]);

  const handleConfirmAction = (res) => {
    if (confirmModal) {
      confirmModal.resolve(res);
      setConfirmModal(null);
    }
  };

  const removeToast = (id) => {
    setToasts(prev => prev.filter(t => t.id !== id));
  };

  return (
    <>
      {/* Container de Toasts Flutuantes */}
      <div className="fixed top-5 right-5 z-[99999] flex flex-col gap-3 max-w-sm sm:max-w-md w-full pointer-events-none px-4 sm:px-0">
        {toasts.map((toast) => {
          let borderClass = 'border-blue-200';
          let iconBg = 'bg-blue-50 text-blue-600 border-blue-100';
          let IconComponent = Info;

          if (toast.type === 'success') {
            borderClass = 'border-green-200';
            iconBg = 'bg-green-50 text-green-600 border-green-100';
            IconComponent = CheckCircle2;
          } else if (toast.type === 'error') {
            borderClass = 'border-red-200';
            iconBg = 'bg-red-50 text-red-600 border-red-100';
            IconComponent = AlertCircle;
          } else if (toast.type === 'warning') {
            borderClass = 'border-amber-200';
            iconBg = 'bg-amber-50 text-amber-600 border-amber-100';
            IconComponent = AlertTriangle;
          }

          return (
            <div
              key={toast.id}
              className={`pointer-events-auto bg-white/95 backdrop-blur-md rounded-2xl p-4 shadow-xl border ${borderClass} animate-toast-in flex items-start gap-3 transition-all duration-200`}
            >
              <div className={`p-2 rounded-xl border shrink-0 ${iconBg}`}>
                <IconComponent className="w-5 h-5" />
              </div>
              <div className="flex-1 min-w-0 pr-1">
                {toast.title && (
                  <h5 className="text-sm font-bold text-gray-900 leading-tight">
                    {toast.title}
                  </h5>
                )}
                <p className={`text-xs text-gray-600 leading-relaxed ${toast.title ? 'mt-1' : ''}`}>
                  {toast.message}
                </p>
              </div>
              <button
                type="button"
                onClick={() => removeToast(toast.id)}
                className="text-gray-400 hover:text-gray-600 p-1 rounded-lg hover:bg-gray-100 transition-colors shrink-0"
                title="Fechar"
              >
                <X className="w-4 h-4" />
              </button>
            </div>
          );
        })}
      </div>

      {/* Modal de Confirmação na Interface */}
      {confirmModal && (
        <div className="fixed inset-0 z-[99998] flex items-center justify-center p-4">
          {/* Backdrop com desfoque */}
          <div 
            className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm transition-opacity"
            onClick={() => handleConfirmAction(false)}
          />

          {/* Card do Modal */}
          <div className="relative bg-white rounded-2xl shadow-2xl border border-gray-100 max-w-md w-full p-6 text-left transform transition-all duration-200 animate-modal-in z-10">
            <div className="flex items-start gap-4">
              <div className={`p-3 rounded-2xl shrink-0 ${
                confirmModal.variant === 'danger'
                  ? 'bg-red-50 text-red-600 border border-red-100'
                  : confirmModal.variant === 'warning'
                  ? 'bg-amber-50 text-amber-600 border border-amber-100'
                  : 'bg-green-50 text-green-600 border border-green-100'
              }`}>
                {confirmModal.variant === 'danger' ? (
                  <Trash2 className="w-6 h-6" />
                ) : confirmModal.variant === 'warning' ? (
                  <AlertTriangle className="w-6 h-6" />
                ) : (
                  <Info className="w-6 h-6" />
                )}
              </div>

              <div className="flex-1 min-w-0">
                <h3 className="text-lg font-bold text-gray-900 leading-snug">
                  {confirmModal.title}
                </h3>
                <p className="text-sm text-gray-600 mt-2 leading-relaxed">
                  {confirmModal.message}
                </p>
              </div>
            </div>

            <div className="mt-6 flex items-center justify-end gap-3">
              <button
                type="button"
                onClick={() => handleConfirmAction(false)}
                className="px-4 py-2.5 rounded-xl border border-gray-200 text-gray-700 font-medium hover:bg-gray-50 transition-colors text-sm"
              >
                {confirmModal.cancelText || 'Cancelar'}
              </button>
              <button
                type="button"
                onClick={() => handleConfirmAction(true)}
                className={`px-5 py-2.5 rounded-xl text-white font-semibold shadow-md transition-all text-sm flex items-center gap-2 ${
                  confirmModal.variant === 'danger'
                    ? 'bg-red-600 hover:bg-red-700 shadow-red-500/20 active:scale-95'
                    : confirmModal.variant === 'warning'
                    ? 'bg-amber-600 hover:bg-amber-700 shadow-amber-500/20 active:scale-95'
                    : 'bg-green-600 hover:bg-green-700 shadow-green-500/20 active:scale-95'
                }`}
              >
                {confirmModal.variant === 'danger' && <Trash2 className="w-4 h-4" />}
                {confirmModal.confirmText || 'Confirmar'}
              </button>
            </div>
          </div>
        </div>
      )}
    </>
  );
};

// 1. Visão do Dashboard Principal
const DashboardView = ({ isAdmin, currentUser, onNavigate }) => {
  const [consultasHoje, setConsultasHoje] = useState([]);
  const [consultasDeHojeCount, setConsultasDeHojeCount] = useState(0);
  const [planosAtivosCount, setPlanosAtivosCount] = useState(0);
  const [routineStats, setRoutineStats] = useState({ total: 0, concluidos: 0, percent: 0 });
  const [loading, setLoading] = useState(true);

  React.useEffect(() => {
    if (!currentUser) {
      setLoading(false);
      return;
    }
    
    const consultasRef = ref(db, 'consultas');
    let q;
    if (isAdmin) {
      q = query(consultasRef);
    } else {
      q = query(consultasRef, orderByChild('pacienteId'), equalTo(currentUser.uid));
    }

    const unsubConsultas = onValue(q, (snapshot) => {
      const listaAgendadas = [];
      const todayDate = new Date();
      const yyyy = todayDate.getFullYear();
      const mm = String(todayDate.getMonth() + 1).padStart(2, '0');
      const dd = String(todayDate.getDate()).padStart(2, '0');
      const hoje = `${yyyy}-${mm}-${dd}`;
      
      let consultasDeHoje = 0;

      snapshot.forEach(child => {
        const val = child.val();
        if (val.status === 'Aprovado' && val.data >= hoje) {
          listaAgendadas.push({ id: child.key, ...val });
          if (val.data === hoje) {
            consultasDeHoje++;
          }
        }
      });

      // Ordenar pelas mais próximas
      listaAgendadas.sort((a, b) => {
        if (a.data === b.data) return (a.hora || '').localeCompare(b.hora || '');
        return (a.data || '').localeCompare(b.data || '');
      });

      setConsultasHoje(listaAgendadas);
      setConsultasDeHojeCount(consultasDeHoje);
      setLoading(false);
    });

    // Monitora Planos Ativos em tempo real via Realtime Database
    let unsubPlanos;
    if (isAdmin) {
      unsubPlanos = onValue(ref(db, 'planos'), (snapshot) => {
        let count = 0;
        snapshot.forEach((childSnap) => {
          const list = normalizePlanosList(childSnap.val());
          if (list.length > 0) count++;
        });
        setPlanosAtivosCount(count);
      });
    } else {
      unsubPlanos = onValue(ref(db, `planos/${currentUser.uid}`), (snapshot) => {
        const list = normalizePlanosList(snapshot.val());
        setPlanosAtivosCount(list.length > 0 ? 1 : 0);
      });
    }

    // Monitora a Rotina Diária se for Paciente
    let unsubRotinaItens, unsubRotinaConcl;
    if (!isAdmin && currentUser) {
      const todayDate = new Date();
      const yyyy = todayDate.getFullYear();
      const mm = String(todayDate.getMonth() + 1).padStart(2, '0');
      const dd = String(todayDate.getDate()).padStart(2, '0');
      const hoje = `${yyyy}-${mm}-${dd}`;

      let itensList = [];
      let conclList = {};

      const updateStats = () => {
        const total = itensList.length;
        const concluidos = itensList.filter(id => !!conclList[id]).length;
        const percent = total > 0 ? Math.round((concluidos / total) * 100) : 0;
        setRoutineStats({ total, concluidos, percent });
      };

      unsubRotinaItens = onValue(ref(db, `rotinas/${currentUser.uid}/itens`), (snap) => {
        itensList = snap.exists() ? Object.keys(snap.val()) : [];
        updateStats();
      });

      unsubRotinaConcl = onValue(ref(db, `rotinas/${currentUser.uid}/conclusoes/${hoje}`), (snap) => {
        conclList = snap.exists() ? snap.val() : {};
        updateStats();
      });
    }

    return () => {
      unsubConsultas();
      if (unsubPlanos) unsubPlanos();
      if (unsubRotinaItens) unsubRotinaItens();
      if (unsubRotinaConcl) unsubRotinaConcl();
    };
  }, [isAdmin, currentUser]);

  const stats = [
    { label: 'Consultas Hoje', value: consultasDeHojeCount.toString(), icon: Calendar, color: 'text-green-600', bg: 'bg-green-100' },
    { label: 'Planos Ativos', value: planosAtivosCount.toString(), icon: Utensils, color: 'text-orange-600', bg: 'bg-orange-100' },
    ...(!isAdmin ? [{
      label: 'Rotina Hoje',
      value: routineStats.total > 0 ? `${routineStats.concluidos}/${routineStats.total} (${routineStats.percent}%)` : 'Configurar',
      icon: ListTodo,
      color: 'text-teal-600',
      bg: 'bg-teal-100',
      action: () => onNavigate && onNavigate('rotina')
    }] : [])
  ];

  return (
    <div className="p-6 space-y-6">
      <div className="flex justify-between items-center">
        <h2 className="text-2xl font-bold text-gray-800">Visão Geral</h2>
        {isAdmin && (
          <button className="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-lg flex items-center shadow transition-colors" onClick={() => notify.info('Vá para a aba Consultas para gerenciar os agendamentos.', 'Agendamentos')}>
            <Plus className="w-5 h-5 mr-2" />
            Nova Consulta
          </button>
        )}
      </div>

      {/* Cards de Estatísticas */}
      <div className={`grid grid-cols-1 ${!isAdmin ? 'md:grid-cols-3' : 'md:grid-cols-2'} gap-6`}>
        {stats.map((stat, index) => (
          <div 
            key={index} 
            onClick={stat.action}
            className={`bg-white p-6 rounded-xl shadow-sm border border-gray-100 flex items-center space-x-4 ${stat.action ? 'cursor-pointer hover:border-teal-300 hover:shadow-md transition-all' : ''}`}
          >
            <div className={`p-3 rounded-full ${stat.bg} ${stat.color}`}>
              <stat.icon className="w-6 h-6" />
            </div>
            <div>
              <p className="text-sm text-gray-500 font-medium">{stat.label}</p>
              <h3 className="text-2xl font-bold text-gray-800">{stat.value}</h3>
            </div>
          </div>
        ))}
      </div>

      {/* Banner de Rotina para o Paciente */}
      {!isAdmin && (
        <div className="bg-gradient-to-r from-teal-600 to-green-600 rounded-2xl p-6 text-white shadow-md relative overflow-hidden flex flex-col md:flex-row items-start md:items-center justify-between gap-4">
          <div className="space-y-1 z-10">
            <div className="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-white/20 text-xs font-semibold backdrop-blur-sm">
              <CheckCircle2 className="w-3.5 h-3.5" /> Checklist Diário & Avisos
            </div>
            <h3 className="text-xl font-bold">Sua Rotina Diária & Metas</h3>
            <p className="text-sm text-teal-100">
              {routineStats.total === 0 
                ? "Monte sua rotina personalizada de hidratação, refeições e hábitos com avisos no horário certo!" 
                : `${routineStats.concluidos} de ${routineStats.total} hábitos concluídos hoje (${routineStats.percent}%). Continue firme!`}
            </p>
          </div>
          <div className="flex items-center gap-3 w-full md:w-auto z-10">
            <button 
              onClick={() => onNavigate && onNavigate('rotina')}
              className="bg-white text-teal-800 hover:bg-teal-50 px-5 py-2.5 rounded-xl font-bold text-sm shadow transition-all flex items-center gap-2 whitespace-nowrap"
            >
              <ListTodo className="w-4 h-4 text-teal-600" />
              {routineStats.total === 0 ? "Montar Minha Rotina" : "Acessar Checklist"}
            </button>
          </div>
        </div>
      )}

      {/* Agenda do Dia */}
      <div className="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
        <div className="px-6 py-4 border-b border-gray-100">
          <h3 className="text-lg font-semibold text-gray-800">Próximas Consultas</h3>
        </div>
        <div className="divide-y divide-gray-100">
          {loading ? (
            <div className="p-10 text-center flex flex-col items-center justify-center text-gray-500">
              <Loader2 className="w-8 h-8 animate-spin text-green-600 mb-2" />
              <p>Carregando agenda...</p>
            </div>
          ) : consultasHoje.length > 0 ? (
            consultasHoje.map((consulta) => (
              <div key={consulta.id} className="p-6 flex flex-col sm:flex-row sm:items-center justify-between hover:bg-gray-50 transition-colors">
                <div className="flex items-center space-x-4 mb-4 sm:mb-0">
                  <div className="bg-green-100 text-green-700 font-bold px-3 py-2 rounded-lg text-center min-w-[70px]">
                    {consulta.hora}
                  </div>
                  <div>
                    <h4 className="text-md font-semibold text-gray-800">{consulta.pacienteNome || 'Paciente'}</h4>
                    <p className="text-sm text-gray-500">{(consulta.data || '').split('-').reverse().join('/')} - {consulta.observacoes || 'Consulta'}</p>
                  </div>
                </div>
                <div>
                  <span className="px-3 py-1 rounded-full text-xs font-medium bg-green-100 text-green-700">
                    Confirmado
                  </span>
                </div>
              </div>
            ))
          ) : (
            <div className="p-10 text-center flex flex-col items-center justify-center text-gray-500">
              <Calendar className="w-12 h-12 text-gray-300 mb-3" />
              <p className="text-lg font-medium text-gray-700">Agenda livre</p>
              <p className="text-sm">Nenhuma consulta confirmada no momento.</p>
            </div>
          )}
        </div>
      </div>
    </div>
  );
};

const PacientesView = ({ isAdmin, onOpenChat, onOpenFicha, onOpenRotina, currentUserId, unreadChats, onDeletePaciente }) => {
  const [searchTerm, setSearchTerm] = useState('');
  const [pacientesList, setPacientesList] = useState([]);
  const [consultas, setConsultas] = useState([]);
  const [loadingData, setLoadingData] = useState(true);
  const [errorMessage, setErrorMessage] = useState('');
  const [deletingId, setDeletingId] = useState(null);

  const handleDelete = async (paciente) => {
    if (deletingId) return;

      if (onDeletePaciente) {
        await onDeletePaciente(paciente);

        const nome = paciente.nome || paciente.email || 'este paciente';

          title: "Excluir Paciente",
          message: `Tem certeza que deseja excluir o paciente "${nome}"? Esta ação apagará permanentemente o cadastro, a ficha de anamnese, planos alimentares, rotinas, conversas e consultas vinculadas.`,
          confirmText: "Sim, Excluir Paciente",
          cancelText: "Cancelar",
          variant: "danger"
        });
        if (!confirmed) return;

        const pacienteId = paciente.id;
        try {
          const qConsultas = query(ref(db, 'consultas'), orderByChild('pacienteId'), equalTo(pacienteId));
          const snapConsultas = await get(qConsultas);
          if (snapConsultas.exists()) {
            const removals = [];
            snapConsultas.forEach((child) => {
              removals.push(remove(ref(db, `consultas/${child.key}`)));
              removals.push(remove(ref(db, `chats/consulta_${child.key}`)));

            await Promise.all(removals);

        try {
          if (currentUserId) {
            const directChatId = [currentUserId, pacienteId].sort().join('_');
            await remove(ref(db, `chats/${directChatId}`));
            await remove(ref(db, `unreadMessages/${currentUserId}/${directChatId}`));
          }
          await remove(ref(db, `unreadMessages/${pacienteId}`));
        } catch(e) { console.warn(e); }

        try { await remove(ref(db, `planos/${pacienteId}`)); } catch(e) { console.warn(e); }
        try { await remove(ref(db, `rotinas/${pacienteId}`)); } catch(e) { console.warn(e); }

    const prox = consultasPaciente[0];
    return `${(prox.data || '').split('-').reverse().join('/')} às ${prox.hora}`;

// 1. Função para criar arquivo Excel (.xlsx) profissional usando SheetJS

  rows.push(["Objetivo:", ficha?.objetivo || "Equilíbrio Nutricional", "", "Meta Calórica Estimada:", `${planData.resumo?.caloriasTotais || 2000} kcal`]);

  (planData.refeicoes || []).forEach(refItem => {
    (refItem.alimentos || []).forEach((item, idx) => {
      rows.push([
        idx === 0 ? refItem.nome : "",
        idx === 0 ? (refItem.horario || "") : "",
        item.item || "",
        item.quantidade || "",
        item.calorias || 0,
        item.prot || 0,
        item.carb || 0,
        item.gord || 0,
        item.obs || ""
      ]);
    });
  });

  rows.push([]);
  rows.push([
    "TOTAL DIÁRIO", "", "", "",
    planData.resumo?.caloriasTotais || 0,
    planData.resumo?.proteinas || 0,
    planData.resumo?.carboidratos || 0,
    planData.resumo?.gorduras || 0,
    "Valores calculados e validados por IA"
  ]);

  const ws = window.XLSX.utils.aoa_to_sheet(rows);
  ws['!cols'] = [
    { wch: 18 }, { wch: 10 }, { wch: 38 }, { wch: 22 },
    { wch: 14 }, { wch: 14 }, { wch: 14 }, { wch: 14 }, { wch: 38 }
  ];
  window.XLSX.utils.book_append_sheet(wb, ws, "Plano Alimentar");

  // Aba 2: Relatório de Auditoria IA
  const auditRows = [];
  auditRows.push(["NUTRIAPP - RELATÓRIO DE DUPLA VERIFICAÇÃO DE IA"]);
  auditRows.push(["Paciente:", pacienteNome]);
  auditRows.push(["Status Geral:", "APROVADO APÓS DUPLA AUDITORIA DE IA"]);
  auditRows.push(["Data da Auditoria:", new Date().toLocaleDateString('pt-BR')]);
  auditRows.push([]);
  auditRows.push(["1ª VERIFICAÇÃO: SEGURANÇA CLÍNICA E ALERGÊNICA"]);
  (planData.verificacao1?.pontosAuditados || []).forEach(p => {
    auditRows.push(["- " + p.item, p.status, p.detalhe]);
  });
  auditRows.push(["Parecer Clínico:", planData.verificacao1?.observacoesClinicas || "Conforme"]);
  auditRows.push([]);
  auditRows.push(["2ª VERIFICAÇÃO: ROTINA, VARIEDADE E FORMATO DA PLANILHA"]);
  (planData.verificacao2?.pontosAuditados || []).forEach(p => {

  const wsAudit = window.XLSX.utils.aoa_to_sheet(auditRows);

const fileOrBlobToDataURL = (fileOrBlob) => {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = (err) => reject(err);
    reader.readAsDataURL(fileOrBlob);
  });
};

const formatFileSize = (bytes) => {
  if (!bytes || isNaN(bytes)) return '';
  if (bytes < 1024) return `${bytes} B`;
  if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)} KB`;
  return `${(bytes / (1024 * 1024)).toFixed(1)} MB`;
};

const downloadFileFromDataUrlOrBlob = (dataUrlOrBlob, fileName) => {
  try {
    let url;
    let shouldRevoke = false;

    if (typeof dataUrlOrBlob === 'string') {
      if (dataUrlOrBlob.startsWith('data:')) {
        const arr = dataUrlOrBlob.split(',');
        const mimeMatch = arr[0].match(/:(.*?);/);
        const mime = mimeMatch ? mimeMatch[1] : 'application/octet-stream';
        const bstr = atob(arr[1]);
        let n = bstr.length;
        const u8arr = new Uint8Array(n);
        while (n--) {
          u8arr[n] = bstr.charCodeAt(n);
        }
        const blob = new Blob([u8arr], { type: mime });
        url = URL.createObjectURL(blob);
        shouldRevoke = true;
      } else {
        url = dataUrlOrBlob;
      }
    } else if (dataUrlOrBlob instanceof Blob) {
      url = URL.createObjectURL(dataUrlOrBlob);
      shouldRevoke = true;
    }

    const a = document.createElement('a');
    a.href = url;
    a.download = fileName || 'Plano_Alimentar.xlsx';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);

    if (shouldRevoke) {
      setTimeout(() => URL.revokeObjectURL(url), 5000);
    }
  } catch (err) {
    console.error("Erro ao disparar download do arquivo:", err);
    notify.error("Erro ao baixar planilha: " + err.message);
  }
};

const triggerPlanoDownload = (plano, paciente, ficha) => {
  if (!plano) {
    notify.warning("Nenhum plano disponível para download.");
    return;
  }
  const fileName = plano.nomeArquivo || `Plano_Alimentar_${paciente?.nome ? paciente.nome.replace(/\s+/g, '_') : 'NutriApp'}.xlsx`;

  // 1. Prioridade: Se possui fileDataUrl salvo diretamente no Realtime Database
  if (plano.fileDataUrl) {
    downloadFileFromDataUrlOrBlob(plano.fileDataUrl, fileName);
    return;
  }

  // 2. Se gerado por IA com dados clínicos estruturados (planoData)
  if (plano.geradoPorIA && plano.planoData) {
    try {
      const blob = generateMealPlanExcelBlob(paciente, ficha, plano.planoData);
      downloadFileFromDataUrlOrBlob(blob, fileName);
      return;
    } catch (e) {
      console.warn("Falha ao reconstruir XLSX a partir de planoData:", e);
    }
  }

  // 3. Fallback: URL externa ou Storage
  if (plano.url) {
    window.open(plano.url, '_blank');
    return;
  }

  notify.warning("Não foi possível localizar o arquivo da planilha para download.");
};

Distribua nas refeições do paciente ${ficha?.refeicoesAoDia ? `(adaptando para: "${ficha.refeicoesAoDia}")` : 'em 5 a 6 refeições (Café da Manhã, Lanche da Manhã, Almoço, Lanche da Tarde, Jantar, Ceia)'}. Respeite rigorosamente as preferências e aversões alimentares informadas.
`;

    const geminiModels = ['gemini-3.7-flash', 'gemini-3.5-flash', 'gemini-flash-latest', 'gemini-3.8-flash'];
    for (const model of geminiModels) {
      try {
        if (onStepProgress) onStepProgress(1, `Processando elaboração nutricional com Google Gemini (${model})...`);
        const res1 = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${cleanKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ contents: [{ parts: [{ text: promptEtapa1 }] }], generationConfig: { responseMimeType: "application/json" } })
        });
        const d1 = await res1.json();
        if (res1.ok && d1.candidates?.[0]?.content?.parts?.[0]?.text) {
          let jsonText = d1.candidates[0].content.parts[0].text.trim();
          if (jsonText.startsWith('```')) {
            jsonText = jsonText.replace(/^```json\s*/i, '').replace(/```\s*$/, '').trim();
          }
          rawPlan = JSON.parse(jsonText);
          rawPlan._modeloUtilizado = model;
          break; // Sucesso na geração com IA
        } else {
          console.warn(`Aviso Gemini (${model}):`, d1.error?.message || `HTTP ${res1.status}`);
        }
      } catch (errModel) {
        console.warn(`Falha de rede/parse no modelo ${model}:`, errModel);
      }
    }
  }

  // Motor clínico integrado especialista (determinístico e adaptado a cada campo da ficha)
  if (!rawPlan) {
    const peso = parseFloat(ficha?.peso) || 70;
    const altura = parseFloat(ficha?.altura) || 170;
    const idade = parseInt(ficha?.idade) || 28;
    const objetivoStr = (ficha?.objetivo || '').toLowerCase();
    const restricoesStr = (ficha?.restricoesAlimentares || '').toLowerCase();
    const historicoStr = (ficha?.historicoMedico || '').toLowerCase();
    const habitosStr = (ficha?.habitos || '').toLowerCase();
    const atividadeStr = (ficha?.nivelAtividade || '').toLowerCase();
    const exerciciosStr = (ficha?.exerciciosDescricao || '').toLowerCase();

    // IMC
    const imc = (peso / ((altura / 100) * (altura / 100))).toFixed(1);
    let classifIMC = "Eutrofia (Peso adequado)";
    if (imc < 18.5) classifIMC = "Baixo peso";
    else if (imc >= 25 && imc < 30) classifIMC = "Sobrepeso";
    else if (imc >= 30) classifIMC = "Obesidade";

    // TMB (Mifflin-St Jeor)
    const tmb = Math.round((10 * peso) + (6.25 * altura) - (5 * idade) + 5);
    let fatorAtividade = 1.35;
    if (atividadeStr.includes('intenso') || atividadeStr.includes('atleta') || habitosStr.includes('intenso')) {
      fatorAtividade = 1.75;
    } else if (atividadeStr.includes('moderado') || habitosStr.includes('trein') || habitosStr.includes('muscul') || habitosStr.includes('corr') || exerciciosStr.includes('muscul')) {
      fatorAtividade = 1.55;
    } else if (atividadeStr.includes('leve')) {
      fatorAtividade = 1.4;
    }
    const tdee = Math.round(tmb * fatorAtividade);

    // Meta calórica pelo objetivo
    let caloriasAlvo = tdee;
    let protGramas = Math.round(peso * 1.6);
    if (objetivoStr.includes('emagrec') || objetivoStr.includes('perda') || objetivoStr.includes('perder') || objetivoStr.includes('defin')) {
      caloriasAlvo = Math.max(1400, tdee - 450);
      protGramas = Math.round(peso * 1.8);
    } else if (objetivoStr.includes('hiper') || objetivoStr.includes('ganho') || objetivoStr.includes('massa')) {
      caloriasAlvo = tdee + 350;
      protGramas = Math.round(peso * 2.0);
    }

    const gordGramas = Math.round(peso * 0.85);
    const caloriasRestantes = caloriasAlvo - (protGramas * 4 + gordGramas * 9);
    const carbGramas = Math.max(80, Math.round(caloriasRestantes / 4));
    const aguaRecomendada = `${((peso * 35) / 1000).toFixed(1)}L a ${((peso * 40) / 1000).toFixed(1)}L`;

    // Filtros de restrição alimentar
    const semLactose = restricoesStr.includes('lactose') || restricoesStr.includes('leite');
    const semGluten = restricoesStr.includes('gluten') || restricoesStr.includes('glúten') || restricoesStr.includes('trigo') || restricoesStr.includes('celíac');
    const vegetariano = restricoesStr.includes('carne') || restricoesStr.includes('vegetar') || restricoesStr.includes('vegano');
    const diabetico = historicoStr.includes('diabet') || historicoStr.includes('glicem');

    rawPlan = {
      resumo: {
        caloriasTotais: caloriasAlvo,
        proteinas: protGramas,
        carboidratos: carbGramas,
        gorduras: gordGramas,
        aguaDiaria: aguaRecomendada,
        objetivo: ficha?.objetivo || "Equilíbrio Nutricional e Saúde",
        diagnosticoIMC: `${imc} kg/m² (${classifIMC})`
      },
      refeicoes: [
        {
          nome: "Café da Manhã",
          horario: habitosStr.includes('acorda') ? "07:00" : "07:30",
          alimentos: [
            { item: "Ovos mexidos com azeite", quantidade: "2 unidades (100g)", calorias: 145, prot: 12, carb: 1, gord: 10, obs: "Preparo suave em fogo baixo" },
            { 
              item: semGluten ? "Tapioca com sementes de chia" : "Pão 100% integral", 
              quantidade: semGluten ? "2 colheres de sopa (40g)" : "2 fatias (50g)", 
              calorias: 120, prot: semGluten ? 2 : 5, carb: 24, gord: 1.5, 
              obs: semGluten ? "Opção segura sem glúten" : "Rico em fibras integrais" 
            },
            { 
              item: semLactose ? "Bebida vegetal de amêndoas ou aveia" : "Iogurte natural desnatado", 
              quantidade: semLactose ? "1 copo (200ml)" : "1 pote (160g)", 
              calorias: semLactose ? 45 : 70, prot: semLactose ? 1.5 : 6, carb: semLactose ? 3 : 9, gord: 1, 
              obs: semLactose ? "Sem lactose garantido" : "Fonte probiótica" 
            },
            { item: "Mamão papaia com aveia em flocos", quantidade: "1 fatia média (100g) + 1 colher sopa (15g)", calorias: 90, prot: 2.5, carb: 18, gord: 1.2, obs: "Excelente para digestão e trânsito intestinal" }
          ]
        },
        {
          nome: "Lanche da Manhã",
          horario: "10:00",
          alimentos: [
            { item: "Maçã ou pera com canela em pó", quantidade: "1 unidade média (120g)", calorias: 65, prot: 0.5, carb: 16, gord: 0.3, obs: diabetico ? "Canela auxilia na sensibilidade à insulina" : "Rica em pectina" },
            { item: "Castanhas do Pará ou nozes", quantidade: "3 unidades (15g)", calorias: 98, prot: 2, carb: 2, gord: 10, obs: "Selênio e gorduras cardioprotetoras" }
          ]
        },
        {
          nome: "Almoço",
          horario: "12:30",
          alimentos: [
            { 
              item: vegetariano ? "Tofu grelhado ou grão-de-bico refogado" : "Filé de peito de frango grelhado", 
              quantidade: vegetariano ? "150g" : "130g", 
              calorias: vegetariano ? 180 : 215, prot: vegetariano ? 22 : 38, carb: vegetariano ? 12 : 0, gord: 5, 
              obs: "Proteína de alto valor biológico" 
            },
            { 
              item: "Arroz integral com sementes de gergelim", 
              quantidade: "4 colheres de sopa (100g)", 
              calorias: 124, prot: 2.6, carb: 26, gord: 1, 
              obs: "Carboidrato complexo de lenta absorção" 
            },
            { item: "Feijão carioca ou lentilha", quantidade: "1 concha média (100g)", calorias: 76, prot: 4.8, carb: 13.6, gord: 0.5, obs: "Ferro vegetal e fibras solúveis" },
            { item: "Salada verde variada (rúcula, alface, tomate, pepino)", quantidade: "1 prato de sobremesa cheio (150g)", calorias: 30, prot: 1.8, carb: 5, gord: 0.3, obs: "À vontade. Temperar com azeite e limão" },
            { item: "Azeite de oliva extra virgem", quantidade: "1 colher de sobremesa (5ml)", calorias: 44, prot: 0, carb: 0, gord: 5, obs: "Polifenóis e gorduras monoinsaturadas" }
          ]
        },
        {
          nome: "Lanche da Tarde",
          horario: "16:00",
          alimentos: [
            { item: "Banana prata amassada", quantidade: "1 unidade média (70g)", calorias: 68, prot: 0.9, carb: 18, gord: 0.2, obs: "Potássio e energia estável" },
            { 
              item: semLactose || vegetariano ? "Proteína vegetal isolada (ervilha/arroz)" : "Whey protein concentrado", 
              quantidade: "1 dosador (30g)", 
              calorias: 120, prot: 24, carb: 2, gord: 1.5, 
              obs: "Diluir em 250ml de água gelada" 
            }
          ]
        },
        {
          nome: "Jantar",
          horario: "19:30",
          alimentos: [
            { 
              item: vegetariano ? "Omelete de claras com espinafre e cogumelos" : "Filé de tilápia grelhada ou patinho moído", 
              quantidade: vegetariano ? "2 claras + 1 gema + 80g cogumelos" : "120g", 
              calorias: 165, prot: 28, carb: 2, gord: 4, 
              obs: "Refeição noturna leve e proteica" 
            },
            { item: "Purê de abóbora cabotiá ou batata inglesa", quantidade: "3 colheres de sopa (90g)", calorias: 75, prot: 1.5, carb: 17, gord: 0.2, obs: "Baixa carga glicêmica e conforto gástrico" },
            { item: "Legumes no vapor (brócolis, cenoura e abobrinha)", quantidade: "1 prato raso (180g)", calorias: 60, prot: 3, carb: 11, gord: 0.5, obs: "Antioxidantes e saciedade noturna" },
            { item: "Azeite de oliva extra virgem", quantidade: "1 colher de chá (3ml)", calorias: 27, prot: 0, carb: 0, gord: 3, obs: "Gordura saudável" }
          ]
        },
        {
          nome: "Ceia",
          horario: "21:45",
          alimentos: [
            { item: "Chá de camomila com erva-doce", quantidade: "1 xícara (200ml)", calorias: 0, prot: 0, carb: 0, gord: 0, obs: "Favorece o relaxamento e o sono profundo" },
            { item: "Mix de sementes de abóbora tostadas", quantidade: "1 colher de sobremesa (10g)", calorias: 55, prot: 3, carb: 1.5, gord: 4.5, obs: "Magnésio e triptofano para o sono reparador" }
          ]
        }
      ]
    };
  }

  // FASE 2: 1ª Verificação - Auditoria Clínica e Alergênica
  if (onStepProgress) onStepProgress(2, "1ª Verificação: Auditando segurança clínica, alergias, intolerâncias e balanço calórico...");
  await new Promise(r => setTimeout(r, 800));

  const pontosClinicos = [];
  const restricoesTexto = (ficha?.restricoesAlimentares || '').trim();
  const historicoTexto = (ficha?.historicoMedico || '').trim();

  pontosClinicos.push({
    item: "Alergias e Intolerâncias",
    status: "Aprovado",
    detalhe: restricoesTexto ? `Validado contra as restrições informadas ("${restricoesTexto}"). Nenhum alérgeno proibido presente no cardápio.` : "Nenhuma restrição alimentar relatada na ficha. Ingredientes 100% seguros."
  });

  pontosClinicos.push({
    item: "Contraindicações Médicas",
    status: "Aprovado",
    detalhe: historicoTexto ? `Compatível com o histórico clínico ("${historicoTexto}"). Alimentos ajustados para preservação metabólica.` : "Sem patologias prévias relatadas na anamnese. Parâmetros clínicos preservados."
  });

  pontosClinicos.push({
    item: "Balanço Calórico e Macronutrientes",
    status: "Aprovado",
    detalhe: `Meta de ${rawPlan.resumo.caloriasTotais} kcal e proporção de ${rawPlan.resumo.proteinas}g proteínas perfeitamente alinhada ao objetivo (${rawPlan.resumo.objetivo}).`
  });

  const verificacao1 = {
    status: "Aprovado",
    titulo: "1ª Verificação: Auditoria Clínica e Alergênica",
    pontosAuditados: pontosClinicos,
    observacoesClinicas: "Plano aprovado clinicamente sem intercorrências ou riscos alérgicos identificados."
  };

  // FASE 3: 2ª Verificação - Auditoria de Rotina, Variedade e Planilha
  if (onStepProgress) onStepProgress(3, "2ª Verificação: Auditando hábitos diários, variedade nutricional e formatação para planilha...");
  await new Promise(r => setTimeout(r, 800));

  const pontosRotina = [
    {
      item: "Aderência e Hábitos do Paciente",
      status: "Aprovado",
      detalhe: `Fracionamento em ${rawPlan.refeicoes.length} refeições com horários compatíveis com a rotina e sono do paciente.`
    },
    {
      item: "Variedade e Densidade Nutricional",
      status: "Aprovado",
      detalhe: "Cardápio contempla múltiplos grupos alimentares: vegetais folhosos, frutas, cereais integrais, sementes e fontes proteicas nobres."
    },
    {
      item: "Integridade Estrutural da Planilha",
      status: "Aprovado",
      detalhe: "Campos de porções, horários, gramas e macros somados matematicamente sem distorções para exportação em Excel (.xlsx)."
    }
  ];

  const verificacao2 = {
    status: "Aprovado",
    titulo: "2ª Verificação: Auditoria de Rotina, Variedade e Formatação",
    pontosAuditados: pontosRotina,
    observacoesRotina: "Estrutura validada com alta praticidade para execução pelo paciente no dia a dia."
  };

  if (onStepProgress) onStepProgress(4, "Plano alimentar finalizado e aprovado pelas 2 verificações de IA!");
  await new Promise(r => setTimeout(r, 400));

  return {
    ...rawPlan,
    verificacao1,
    verificacao2
  };
};

// 3. Modal para Gerenciar Chave de API do Gemini
const ApiKeyModal = ({ isOpen, onClose, currentKey, onSaveKey }) => {
  const [keyInput, setKeyInput] = useState(currentKey || '');
  const [testing, setTesting] = useState(false);
  const [testResult, setTestResult] = useState(null);

  React.useEffect(() => {
    if (currentKey) {
      setKeyInput(currentKey);
    }
  }, [currentKey]);

  if (!isOpen) return null;

  const handleTest = async () => {
    const cleanKey = keyInput.trim();
    if (!cleanKey) {
      notify.warning("Digite uma chave de API para testar.");
      return;
    }
    setTesting(true);
    setTestResult(null);

    const testModels = ['gemini-3.7-flash', 'gemini-3.5-flash', 'gemini-flash-latest', 'gemini-3.8-flash'];
    let connected = false;
    let lastError = '';

    for (const m of testModels) {
      try {
        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${m}:generateContent?key=${cleanKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ contents: [{ parts: [{ text: "ping" }] }] })
        });
        const data = await res.json();
        if (res.ok) {
          setTestResult({
            success: true,
            message: `Conectado com sucesso ao Google Gemini! (Modelo ativo: ${m})`
          });
          connected = true;
          break;
        } else {
          lastError = data.error?.message || `Erro HTTP ${res.status}`;
        }
      } catch (err) {
        lastError = err.message;
      }
    }

    if (!connected) {
      setTestResult({
        success: false,
        message: `Falha ao validar: ${lastError || 'Verifique se a chave está ativa no Google AI Studio.'}`
      });
    }

    setTesting(false);
  };

  const handleSave = (e) => {
    e.preventDefault();
    onSaveKey(keyInput.trim());
    onClose();
  };

  return (
    <div className="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
      <div className="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl border border-gray-100">
        <div className="flex items-center justify-between pb-4 border-b border-gray-100">
          <div className="flex items-center gap-2 text-green-700">
            <Key className="w-5 h-5" />
            <h3 className="font-bold text-lg text-gray-800">Chave Google Gemini API</h3>
          </div>
          <button onClick={onClose} className="text-gray-400 hover:text-gray-600 p-1 rounded-lg">
            <X className="w-5 h-5" />
          </button>
        </div>

        <form onSubmit={handleSave} className="mt-4 space-y-4">
          <p className="text-xs text-gray-500 leading-relaxed">
            Configure sua chave gratuita do Google Gemini para alimentar as etapas de elaboração e auditoria com os modelos mais avançados. Se deixada em branco, o NutriApp utiliza o <strong>Motor Clínico Integrado</strong> automaticamente.
          </p>

          <div>
            <label className="block text-xs font-semibold text-gray-700 mb-1">Gemini API Key</label>
            <input 
              type="password"
              value={keyInput}
              onChange={(e) => setKeyInput(e.target.value)}
              placeholder="AIzaSy..."
              className="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-green-500 outline-none"
            />
          </div>

          <div className="flex items-center justify-between text-xs">
            <a 
              href="https://aistudio.google.com/app/apikey" 
              target="_blank" 
              rel="noopener noreferrer"
              className="text-green-600 hover:underline flex items-center gap-1"
            >
              Obter chave no Google AI Studio &rarr;
            </a>
            <button 
              type="button"
              onClick={handleTest}
              disabled={testing || !keyInput.trim()}
              className="text-xs text-gray-600 hover:text-gray-900 border border-gray-200 px-2.5 py-1 rounded-md hover:bg-gray-50 flex items-center gap-1"
            >
              {testing ? <Loader2 className="w-3 h-3 animate-spin" /> : <RefreshCw className="w-3 h-3" />}
              Testar
            </button>
          </div>

          {testResult && (
            <div className={`p-2.5 rounded-lg text-xs flex items-center gap-2 ${testResult.success ? 'bg-green-50 text-green-700 border border-green-200' : 'bg-red-50 text-red-700 border border-red-200'}`}>
              {testResult.success ? <CheckCircle2 className="w-4 h-4 shrink-0" /> : <AlertTriangle className="w-4 h-4 shrink-0" />}
              <span>{testResult.message}</span>
            </div>
          )}

          <div className="flex gap-2 pt-2">
            <button 
              type="button" 
              onClick={onClose}
              className="flex-1 py-2 text-sm text-gray-600 border border-gray-200 rounded-lg hover:bg-gray-50"
            >
              Cancelar
            </button>
            <button 
              type="submit"
              className="flex-1 py-2 text-sm bg-green-600 hover:bg-green-700 text-white rounded-lg font-medium shadow-sm"
            >
              Salvar Chave
            </button>
          </div>
        </form>
      </div>
    </div>
  );
};

// 4. Modal Interativo de Geração e Dupla Auditoria de IA
const AIMealPlanModal = ({ 
  isOpen, 
  onClose, 
  paciente, 
  ficha, 
  geminiApiKey, 
  initialPlanData, 
  isViewingOnly, 
  onApproveAndDeliver 
}) => {
  const [currentStep, setCurrentStep] = useState(1);
  const [stepMessage, setStepMessage] = useState('');
  const [generating, setGenerating] = useState(false);
  const [planData, setPlanData] = useState(initialPlanData || null);
  const [delivering, setDelivering] = useState(false);
  const [activeTab, setActiveTab] = useState('cardapio'); // 'cardapio' | 'auditoria'

  const pacienteNome = paciente?.nome || paciente?.email || "Paciente";

  const runPipeline = async () => {
    setGenerating(true);
    setPlanData(null);
    try {
      let keyToUse = (geminiApiKey || '').trim() || localStorage.getItem('gemini_api_key') || '';
      if (!keyToUse) {
        try {
          const snap = await get(ref(db, 'config/geminiApiKey'));
          if (snap.exists() && snap.val()) keyToUse = snap.val().trim();
        } catch (_) {}
      }

      const result = await generateAIMealPlanPipeline(
        paciente,
        ficha,
        keyToUse,
        (step, msg) => {
          setCurrentStep(step);
          setStepMessage(msg);
        }
      );
      setPlanData(result);
    } catch (err) {
      console.error("Erro no pipeline de IA:", err);
      notify.error("Erro ao processar plano alimentar com IA: " + err.message);
    } finally {
      setGenerating(false);
    }
  };

  React.useEffect(() => {
    if (isOpen) {
      if (initialPlanData) {
        setPlanData(initialPlanData);
        setGenerating(false);
      } else {
        runPipeline();
      }
    } else {
      setPlanData(null);
      setGenerating(false);
      setCurrentStep(1);
    }
  }, [isOpen, initialPlanData]);

  if (!isOpen) return null;

  const handleDownloadOfflineXlsx = () => {
    if (!planData) return;
    try {
      const blob = generateMealPlanExcelBlob(paciente, ficha, planData);
      downloadFileFromDataUrlOrBlob(blob, `Plano_Alimentar_${pacienteNome.replace(/\s+/g, '_')}_IA.xlsx`);
    } catch (err) {
      notify.error("Erro ao gerar planilha local: " + err.message);
    }
  };

  const handleConfirmDelivery = async () => {
    if (!planData || delivering) return;
    setDelivering(true);
    try {
      const blob = generateMealPlanExcelBlob(paciente, ficha, planData);
      const fileName = `Plano_Alimentar_${pacienteNome.replace(/\s+/g, '_')}_IA.xlsx`;
      await onApproveAndDeliver(blob, planData, fileName);
    } catch (err) {
      console.error(err);
      notify.error("Erro ao entregar plano: " + err.message);
    } finally {
      setDelivering(false);
    }
  };

  return (
    <div className="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-3 sm:p-6 overflow-y-auto">
      <div className="bg-white rounded-2xl max-w-4xl w-full shadow-2xl border border-gray-100 flex flex-col max-h-[92vh] overflow-hidden my-auto">
        
        {/* Top Header */}
        <div className="px-6 py-4 bg-gradient-to-r from-green-600 via-emerald-600 to-teal-700 text-white flex items-center justify-between shrink-0">
          <div className="flex items-center gap-3">
            <div className="p-2 bg-white/15 rounded-xl backdrop-blur-sm">
              <Sparkles className="w-6 h-6 text-yellow-300" />
            </div>
            <div>
              <h3 className="font-bold text-lg sm:text-xl">
                {isViewingOnly ? "Relatório de Plano Alimentar com IA" : "Gerador Inteligente com Dupla Auditoria"}
              </h3>
              <p className="text-xs text-green-100">Paciente: <strong>{pacienteNome}</strong></p>
            </div>
          </div>
          <button onClick={onClose} className="text-white/80 hover:text-white p-1 rounded-lg hover:bg-white/10 transition-colors">
            <X className="w-6 h-6" />
          </button>
        </div>

        {/* Corpo do Modal */}
        <div className="p-6 overflow-y-auto flex-1 space-y-6">

          {/* Stepper durante a geração */}
          {generating && (

// ==========================================
// MÓDULO DE PLANILHA: VISUALIZAÇÃO E EDIÇÃO INTEGRADA (SHEETJS + RTDB)
// ==========================================
const SpreadsheetModal = ({
  isOpen,
  onClose,
  plano,
  paciente,
  ficha,
  readOnly = false,
  onSaveSuccess,
  geminiApiKey: initialGeminiApiKey
}) => {
  if (!isOpen || !plano) return null;

  const [loading, setLoading] = useState(true);
  const [loadError, setLoadError] = useState(null);
  const [sheetNames, setSheetNames] = useState([]);
  const [activeSheetIndex, setActiveSheetIndex] = useState(0);
  const [sheetsData, setSheetsData] = useState({}); // { [nomeAba]: string[][] }
  const [undoStack, setUndoStack] = useState([]);
  const [selectedCell, setSelectedCell] = useState({ row: 0, col: 0 });
  const [isInlineEditing, setIsInlineEditing] = useState(false);
  const [searchTerm, setSearchTerm] = useState('');
  const [isFullScreen, setIsFullScreen] = useState(false);
  const [hasUnsavedChanges, setHasUnsavedChanges] = useState(false);
  const [isSaving, setIsSaving] = useState(false);
  const [activeMode, setActiveMode] = useState(readOnly ? 'view' : 'edit'); // 'view' | 'edit'

  // Estados do Chatbot de IA para Modificação da Planilha
  const [showAIChat, setShowAIChat] = useState(false);
  const [aiChatMessages, setAiChatMessages] = useState(() => [
    {
      id: 'welcome',
      sender: 'ai',
      text: 'Olá! Sou o assistente de IA da planilha. Posso alterar alimentos, recalcular macronutrientes e calorias, adicionar opções alternativas (sem glúten, vegana, low-carb) ou modificar qualquer refeição. Diga o que deseja alterar!',
      timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
    }
  ]);
  const [aiChatInput, setAiChatInput] = useState('');
  const [aiChatLoading, setAiChatLoading] = useState(false);
  const [apiKey, setApiKey] = useState(() => initialGeminiApiKey || localStorage.getItem('gemini_api_key') || '');
  const chatEndRef = React.useRef(null);

  React.useEffect(() => {
    if (showAIChat) {
      chatEndRef.current?.scrollIntoView({ behavior: 'smooth' });
    }
  }, [showAIChat, aiChatMessages]);

  React.useEffect(() => {
    const unsubKey = onValue(ref(db, 'config/geminiApiKey'), (snapshot) => {
      if (snapshot.exists() && snapshot.val()) {
        setApiKey(snapshot.val().trim());
      }
    });
    return () => unsubKey();
  }, []);

  const fileName = plano.nomeArquivo || (plano.geradoPorIA ? 'Plano_Alimentar_IA.xlsx' : 'Planilha_Alimentar.xlsx');
  const isPdf = Boolean(
    (fileName && fileName.toLowerCase().endsWith('.pdf')) ||
    (plano.tipoArquivo && plano.tipoArquivo.includes('pdf'))
  );

  // Carregamento dos dados da planilha
  React.useEffect(() => {
    if (isPdf) {
      setLoading(false);
      return;
    }
    loadWorkbookData();
  }, [plano]);

  const loadWorkbookData = async () => {
    setLoading(true);
    setLoadError(null);
    try {
      if (!window.XLSX) {
        throw new Error("Biblioteca SheetJS (XLSX) não carregada no navegador.");
      }

      let wb = null;
      // 1. Tentar ler Data URL (Base64)
      if (plano.fileDataUrl) {
        const base64 = plano.fileDataUrl.includes(',') 
          ? plano.fileDataUrl.split(',')[1] 
          : plano.fileDataUrl;
        wb = window.XLSX.read(base64, { type: 'base64', cellDates: true });
      } 
      // 2. Se for gerado por IA com planoData
      else if (plano.planoData) {
        const blob = generateMealPlanExcelBlob(paciente, ficha, plano.planoData);
        const dataUrl = await fileOrBlobToDataURL(blob);
        const base64 = dataUrl.split(',')[1];
        wb = window.XLSX.read(base64, { type: 'base64', cellDates: true });
      }
      // 3. Fallback: URL externa
      else if (plano.url) {
        const res = await fetch(plano.url);
        const buf = await res.arrayBuffer();
        wb = window.XLSX.read(new Uint8Array(buf), { type: 'array' });
      }

      if (!wb || !wb.SheetNames || wb.SheetNames.length === 0) {
        throw new Error("O arquivo não possui abas válidas para leitura.");
      }

      const map = {};
      wb.SheetNames.forEach(sheetName => {
        const ws = wb.Sheets[sheetName];
        let rows = window.XLSX.utils.sheet_to_json(ws, { header: 1, defval: '', raw: false });
        if (!rows || rows.length === 0) {
          rows = [['']];
        }
        // Determinar o número máximo de colunas
        let maxCols = 6;
        rows.forEach(r => {
          if (Array.isArray(r) && r.length > maxCols) maxCols = r.length;
        });
        // Normalizar matriz
        const norm = rows.map(r => {
          const rowArr = Array.isArray(r) ? [...r] : [];
          while (rowArr.length < maxCols) rowArr.push('');
          return rowArr.map(val => (val === null || val === undefined ? '' : String(val)));
        });
        // Garantir pelo menos 18 linhas para conforto de edição
        while (norm.length < 18) {
          norm.push(new Array(maxCols).fill(''));
        }
        map[sheetName] = norm;
      });

      setSheetNames(wb.SheetNames);
      setActiveSheetIndex(0);
      setSheetsData(map);
      setUndoStack([]);
      setHasUnsavedChanges(false);
      setSelectedCell({ row: 0, col: 0 });
    } catch (err) {
      console.error("Falha ao carregar planilha no editor:", err);
      setLoadError(err.message || "Não foi possível processar este arquivo.");
    } finally {
      setLoading(false);
    }
  };

  const currentSheetName = sheetNames[activeSheetIndex] || '';
  const currentRows = sheetsData[currentSheetName] || [];
  const numCols = currentRows[0] ? currentRows[0].length : 6;

  // Letra da Coluna (A, B, C... Z, AA, AB...)
  const getColLetter = (index) => {
    let letter = '';
    let temp = index;
    while (temp >= 0) {
      letter = String.fromCharCode((temp % 26) + 65) + letter;
      temp = Math.floor(temp / 26) - 1;
    }
    return letter;
  };

  // Coordenada da Célula Ativa (ex: A1, C4)
  const activeCellCoord = selectedCell
    ? `${getColLetter(selectedCell.col)}${selectedCell.row + 1}`
    : '--';

  const activeCellValue = selectedCell && currentRows[selectedCell.row]
    ? (currentRows[selectedCell.row][selectedCell.col] || '')
    : '';

  // Atualização de Célula
  const handleUpdateCell = (rowIdx, colIdx, val) => {
    if (readOnly || activeMode === 'view') return;
    if (!currentSheetName) return;

    // Salvar estado no Undo
    setUndoStack(prev => [...prev.slice(-15), JSON.parse(JSON.stringify(sheetsData))]);

    setSheetsData(prev => {
      const copy = { ...prev };
      const rows = (copy[currentSheetName] || []).map((r, rI) => {
        if (rI !== rowIdx) return r;
        const newR = [...r];
        newR[colIdx] = val;
        return newR;
      });
      copy[currentSheetName] = rows;
      return copy;
    });

    setHasUnsavedChanges(true);
  };

  // Desfazer (Undo)
  const handleUndo = () => {
    if (undoStack.length === 0) return;
    const prev = undoStack[undoStack.length - 1];
    setUndoStack(old => old.slice(0, old.length - 1));
    setSheetsData(prev);
    setHasUnsavedChanges(true);
  };

  // Adicionar Linha
  const handleAddRow = () => {
    if (readOnly || activeMode === 'view') return;
    setUndoStack(prev => [...prev.slice(-15), JSON.parse(JSON.stringify(sheetsData))]);

    setSheetsData(prev => {
      const copy = { ...prev };
      const rows = [...(copy[currentSheetName] || [])];
      const insertIdx = selectedCell ? selectedCell.row + 1 : rows.length;
      rows.splice(insertIdx, 0, new Array(numCols).fill(''));
      copy[currentSheetName] = rows;
      return copy;
    });
    if (selectedCell) {
      setSelectedCell(prev => ({ ...prev, row: prev.row + 1 }));
    }
    setHasUnsavedChanges(true);
  };

  // Excluir Linha
  const handleDeleteRow = () => {
    if (readOnly || activeMode === 'view' || !selectedCell) return;
    if (currentRows.length <= 1) {
      notify.warning("A planilha deve conter pelo menos uma linha.");
      return;
    }
    setUndoStack(prev => [...prev.slice(-15), JSON.parse(JSON.stringify(sheetsData))]);

    setSheetsData(prev => {
      const copy = { ...prev };
      const rows = [...(copy[currentSheetName] || [])];
      rows.splice(selectedCell.row, 1);
      copy[currentSheetName] = rows;
      return copy;
    });

    setSelectedCell(prev => ({
      ...prev,
      row: Math.max(0, Math.min(prev.row, currentRows.length - 2))
    }));
    setHasUnsavedChanges(true);
  };

  // Adicionar Coluna
  const handleAddColumn = () => {
    if (readOnly || activeMode === 'view') return;
    setUndoStack(prev => [...prev.slice(-15), JSON.parse(JSON.stringify(sheetsData))]);

    setSheetsData(prev => {
      const copy = { ...prev };
      const rows = (copy[currentSheetName] || []).map(r => [...r, '']);
      copy[currentSheetName] = rows;
      return copy;
    });
    setHasUnsavedChanges(true);
  };

  // Excluir Coluna
  const handleDeleteColumn = () => {
    if (readOnly || activeMode === 'view' || !selectedCell) return;
    if (numCols <= 1) {
      notify.warning("A planilha deve conter pelo menos uma coluna.");
      return;
    }
    setUndoStack(prev => [...prev.slice(-15), JSON.parse(JSON.stringify(sheetsData))]);

    setSheetsData(prev => {
      const copy = { ...prev };
      const rows = (copy[currentSheetName] || []).map(r => {
        const copyR = [...r];
        copyR.splice(selectedCell.col, 1);
        return copyR;
      });
      copy[currentSheetName] = rows;
      return copy;
    });

    setSelectedCell(prev => ({
      ...prev,
      col: Math.max(0, Math.min(prev.col, numCols - 2))
    }));
    setHasUnsavedChanges(true);
  };

  // Salvar no Firebase Realtime Database
  const handleSaveToDatabase = async () => {
    if (readOnly || isSaving) return;
    setIsSaving(true);
    try {
      const newWb = window.XLSX.utils.book_new();
      sheetNames.forEach(name => {
        const rows = sheetsData[name] || [];
        // Limpar linhas em branco excessivas no final
        let endIdx = rows.length - 1;
        while (endIdx > 0 && rows[endIdx].every(c => !c || String(c).trim() === '')) {
          endIdx--;
        }
        const cleanRows = rows.slice(0, endIdx + 1);
        const ws = window.XLSX.utils.aoa_to_sheet(cleanRows);
        window.XLSX.utils.book_append_sheet(newWb, ws, name);
      });

      const base64Out = window.XLSX.write(newWb, { bookType: 'xlsx', type: 'base64' });
      const newDataUrl = `data:application/vnd.openxmlformats-officedocument.spreadsheetml.sheet;base64,${base64Out}`;
      const estSize = Math.round((base64Out.length * 3) / 4);

      const targetPath = plano.id === 'legacy'
        ? `planos/${paciente.id}`
        : `planos/${paciente.id}/${plano.id}`;

      await update(ref(db, targetPath), {
        fileDataUrl: newDataUrl,
        dataModificacao: new Date().toISOString(),
        tamanho: estSize
      });

      setHasUnsavedChanges(false);
      notify.success("Planilha atualizada e salva com sucesso no banco de dados!", "Planilha Salva");
      if (onSaveSuccess) {
        onSaveSuccess({ ...plano, fileDataUrl: newDataUrl, tamanho: estSize });
      }
    } catch (err) {
      console.error("Erro ao salvar planilha no Firebase:", err);
      notify.error("Erro ao salvar planilha: " + err.message);
    } finally {
      setIsSaving(false);
    }
  };

  // Função para a IA processar alterações na planilha existente
  const handleSendMessageToAI = async (textToSend) => {
    const instruction = (textToSend || aiChatInput).trim();
    if (!instruction || aiChatLoading) return;

    const currentSheet = sheetNames[activeSheetIndex] || sheetNames[0];
    const currentSheetRows = sheetsData[currentSheet] || [];

    // Adiciona a mensagem do usuário no chat
    const userMsg = {
      id: Date.now().toString(),
      sender: 'user',
      text: instruction,
      timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
    };
    setAiChatMessages(prev => [...prev, userMsg]);
    setAiChatInput('');
    setAiChatLoading(true);

    // Identificar chave Gemini
    let cleanKey = apiKey ? apiKey.trim() : '';
    if (!cleanKey) {
      cleanKey = (localStorage.getItem('gemini_api_key') || '').trim();
    }
    if (!cleanKey) {
      try {
        const snap = await get(ref(db, 'config/geminiApiKey'));
        if (snap.exists() && snap.val()) {
          cleanKey = snap.val().trim();
        }
      } catch(e) { console.warn(e); }
    }

    if (!cleanKey) {
      setAiChatLoading(false);
      setAiChatMessages(prev => [
        ...prev,
        {
          id: (Date.now() + 1).toString(),
          sender: 'ai',
          text: 'Chave da API Google Gemini não encontrada. Por favor, insira sua chave abaixo para que a IA possa processar e modificar a planilha.',
          isError: true,
          needKey: true,
          timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
        }
      ]);
      return;
    }

    try {
      const patientContext = `
DADOS DO PACIENTE:
- Nome: ${paciente?.nome || paciente?.email || 'Paciente'}
- Idade: ${ficha?.idade || 'Não informada'}
- Peso atual: ${ficha?.peso || 'Não informado'}
- Altura: ${ficha?.altura || 'Não informada'}
- Objetivo clínico: ${ficha?.objetivo || 'Reeducação alimentar'}
${ficha?.refeicoesAoDia ? `- Refeições ao dia desejadas: ${ficha.refeicoesAoDia}` : ''}
${ficha?.consumoAgua ? `- Consumo de água: ${ficha.consumoAgua}` : ''}
${ficha?.alimentosFavoritos ? `- Alimentos favoritos (priorizar): ${ficha.alimentosFavoritos}` : ''}
${ficha?.alimentosAversao ? `- Alimentos com aversão (evitar): ${ficha.alimentosAversao}` : ''}
- Restrições / Alergias: ${ficha?.restricoesAlimentares || 'Nenhuma informada'}
${ficha?.nivelAtividade ? `- Nível de atividade física: ${ficha.nivelAtividade}` : ''}
${ficha?.suplementos ? `- Suplementos: ${ficha.suplementos}` : ''}
- Hábitos e Rotina: ${ficha?.habitos || 'Padrão'}
${ficha?.observacoes ? `- Observações adicionais: ${ficha.observacoes}` : ''}
`;

      // Eliminar linhas vazias excessivas para economizar tokens
      let endIdx = currentSheetRows.length - 1;
      while (endIdx > 0 && currentSheetRows[endIdx].every(c => !c || String(c).trim() === '')) {
        endIdx--;
      }
      const relevantRows = currentSheetRows.slice(0, endIdx + 1);

      const promptAI = `
Você é uma inteligência artificial especialista em Nutrição Clínica e edição de planilhas alimentares em Excel/CSV.
A nutricionista está solicitando uma modificação na planilha atual do paciente.

${patientContext}

ABA ATUAL SENDO MODIFICADA: "${currentSheet}"

GRADE MATRICIAL ATUAL DA PLANILHA (Linhas e colunas):
${JSON.stringify(relevantRows, null, 2)}

SOLICITAÇÃO DA NUTRICIONISTA:
"${instruction}"

DIRETRIZES FUNDAMENTAIS:
1. Aplique a modificação solicitada diretamente na grade matricial da planilha.
2. Mantenha os mesmos cabeçalhos de coluna e número de colunas intactos.
3. Se substituir alimentos, calcule adequadamente as calorias e macronutrientes da linha (Proteínas, Carboidratos, Lipídios).
4. Se for adicionar ou excluir refeições/alimentos, ajuste a ordenação e os horários coerentemente.
5. Se houver linhas de totais ou sumário diário, recalcule os totais para refletir as novas quantidades.
6. Mantenha todas as linhas não afetadas pela solicitação exatamente como estão.
7. Retorne EXCLUSIVAMENTE um objeto JSON válido, sem texto explicativo fora do JSON, no formato:
{
  "mensagem": "Explicação detalhada e amigável para a nutricionista sobre o que foi modificado e os impactos clínicos/nutricionais.",
  "novasLinhas": [
    ["Refeição", "Horário", "Alimento", "Quantidade", "Calorias (kcal)", "Proteínas (g)", "Carboidratos (g)", "Lipídios (g)"],
    ...
  ]
}
`;

      const geminiModels = ['gemini-3.7-flash', 'gemini-3.5-flash', 'gemini-flash-latest', 'gemini-3.8-flash'];
      let aiResponse = null;
      let modelUsed = null;

      for (const model of geminiModels) {
        try {
          const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${cleanKey}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: [{ parts: [{ text: promptAI }] }],
              generationConfig: { responseMimeType: "application/json" }
            })
          });

          const data = await res.json();
          if (res.ok && data.candidates?.[0]?.content?.parts?.[0]?.text) {
            let jsonText = data.candidates[0].content.parts[0].text.trim();
            if (jsonText.startsWith('```')) {
              jsonText = jsonText.replace(/^```json\s*/i, '').replace(/```\s*$/, '').trim();
            }
            aiResponse = JSON.parse(jsonText);
            modelUsed = model;
            break;
          } else {
            console.warn(`Aviso Gemini (${model}):`, data.error?.message || `HTTP ${res.status}`);
          }
        } catch (errModel) {
          console.warn(`Falha no modelo ${model}:`, errModel);
        }
      }

      if (!aiResponse || !Array.isArray(aiResponse.novasLinhas) || aiResponse.novasLinhas.length === 0) {
        throw new Error("A IA não retornou uma estrutura de planilha válida. Tente reformular a solicitação com mais detalhes.");
      }

      // Salva no Undo antes de aplicar
      setUndoStack(prev => [...prev.slice(-15), JSON.parse(JSON.stringify(sheetsData))]);

      // Normaliza as colunas e garante mínimo de 18 linhas para edição confortável
      const targetCols = Math.max(numCols, ...aiResponse.novasLinhas.map(r => Array.isArray(r) ? r.length : 0));
      const normalizedRows = aiResponse.novasLinhas.map(r => {
        const rowArr = Array.isArray(r) ? [...r] : [];
        while (rowArr.length < targetCols) rowArr.push('');
        return rowArr.map(val => (val === null || val === undefined ? '' : String(val)));
      });
      while (normalizedRows.length < 18) {
        normalizedRows.push(new Array(targetCols).fill(''));
      }

      // Aplica a nova matriz na aba atual
      setSheetsData(prev => ({
        ...prev,
        [currentSheet]: normalizedRows
      }));
      setHasUnsavedChanges(true);

      // Adiciona resposta da IA ao chat
      setAiChatMessages(prev => [
        ...prev,
        {
          id: (Date.now() + 1).toString(),
          sender: 'ai',
          text: aiResponse.mensagem || "Modificações aplicadas à planilha com sucesso!",
          changesApplied: true,
          model: modelUsed,
          timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
        }
      ]);

      notify.success("Planilha modificada pela IA! Você pode revisar e salvar quando quiser.", "Planilha Modificada");

    } catch (error) {
      console.error("Erro ao modificar planilha com IA:", error);
      setAiChatMessages(prev => [
        ...prev,
        {
          id: (Date.now() + 1).toString(),
          sender: 'ai',
          text: `Não foi possível modificar a planilha: ${error.message || 'Erro inesperado'}. Você pode tentar novamente com um comando mais específico.`,
          isError: true,
          timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
        }
      ]);
      notify.error("Falha ao modificar planilha com IA.");
    } finally {
      setAiChatLoading(false);
    }
  };

  // Baixar Planilha Atualizada (.xlsx)
  const handleDownloadFromModal = () => {
    try {
      if (isPdf) {
        downloadFileFromDataUrlOrBlob(plano.fileDataUrl || plano.url, fileName);
        return;
      }
      const newWb = window.XLSX.utils.book_new();
      sheetNames.forEach(name => {
        const ws = window.XLSX.utils.aoa_to_sheet(sheetsData[name] || []);
        window.XLSX.utils.book_append_sheet(newWb, ws, name);
      });
      const wbout = window.XLSX.write(newWb, { bookType: 'xlsx', type: 'array' });
      const blob = new Blob([wbout], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
      downloadFileFromDataUrlOrBlob(blob, fileName);
      notify.success("Download da planilha iniciado!");
    } catch (e) {
      notify.error("Erro ao exportar planilha: " + e.message);
    }
  };

  // Fechamento Seguro (com aviso se houver mudanças pendentes)
  const handleSafeClose = async () => {
    if (hasUnsavedChanges) {
      const confirmed = await showConfirm({
        title: "Alterações Não Salvas",

        confirmText: "Sim, Sair Sem Salvar",

        variant: "warning"
      });
      if (!confirmed) return;
    }
    onClose();
  };

  // Contagem de resultados da busca
  const cleanSearch = searchTerm.trim().toLowerCase();
  const searchMatchesCount = React.useMemo(() => {
    if (!cleanSearch || !currentRows) return 0;
    let count = 0;
    currentRows.forEach(row => {
      row.forEach(cell => {
        if (cell && String(cell).toLowerCase().includes(cleanSearch)) count++;
      });
    });
    return count;
  }, [cleanSearch, currentRows]);

  return (
    <div className={`fixed inset-0 z-50 flex items-center justify-center p-2 sm:p-4 bg-black/65 backdrop-blur-sm transition-all duration-200 ${isFullScreen ? 'p-0' : ''}`}>
      <div className={`bg-white rounded-2xl shadow-2xl flex flex-col overflow-hidden border border-gray-200 transition-all duration-200 animate-modal-in ${isFullScreen ? 'w-full h-full rounded-none' : 'w-[96vw] max-w-6xl h-[92vh]'}`}>
        
        {/* CABEÇALHO SUPERIOR */}
        <div className="bg-gradient-to-r from-emerald-800 via-teal-800 to-emerald-950 text-white px-5 py-3.5 flex items-center justify-between shrink-0 shadow-md">
          <div className="flex items-center gap-3 min-w-0">
            <div className="p-2 bg-white/10 rounded-xl backdrop-blur-sm shrink-0">
              <Table className="w-5 h-5 text-emerald-300" />
            </div>
            <div className="min-w-0">
              <div className="flex items-center gap-2 flex-wrap">
                <h3 className="font-bold text-base text-white truncate max-w-xs sm:max-w-md" title={fileName}>
                  {fileName}
                </h3>
                {readOnly ? (
                  <span className="bg-emerald-500/25 border border-emerald-400/40 text-emerald-200 text-[11px] font-semibold px-2 py-0.5 rounded-full flex items-center gap-1">
                    <Eye className="w-3 h-3" /> Modo Visualização
                  </span>
                ) : (
                  <span className={`text-[11px] font-semibold px-2 py-0.5 rounded-full flex items-center gap-1 border ${
                    activeMode === 'edit'
                      ? 'bg-blue-500/25 border-blue-400/40 text-blue-200'
                      : 'bg-emerald-500/25 border-emerald-400/40 text-emerald-200'
                  }`}>
                    {activeMode === 'edit' ? <Edit3 className="w-3 h-3" /> : <Eye className="w-3 h-3" />}
                    {activeMode === 'edit' ? 'Modo Edição' : 'Modo Leitura'}
                  </span>
                )}
                
                {hasUnsavedChanges && (
                  <span className="bg-amber-500/25 border border-amber-400/40 text-amber-200 text-[11px] font-semibold px-2 py-0.5 rounded-full flex items-center gap-1 animate-pulse">
                    <span className="w-1.5 h-1.5 rounded-full bg-amber-400"></span>
                    Alterações Não Salvas
                  </span>
                )}
              </div>
              <p className="text-xs text-emerald-200/80 truncate mt-0.5">
                Paciente: <span className="text-white font-medium">{paciente?.nome || paciente?.email || 'Paciente'}</span>
                {plano.tamanho ? ` • ${formatFileSize(plano.tamanho)}` : ''}
              </p>
            </div>
          </div>

          <div className="flex items-center gap-2 shrink-0">
            {/* Alternância de Modo (para Nutricionista) */}
            {!readOnly && !isPdf && (
              <button
                onClick={() => {
                  setActiveMode(prev => prev === 'edit' ? 'view' : 'edit');
                  setIsInlineEditing(false);
                }}
                className="hidden sm:flex items-center gap-1.5 text-xs font-semibold px-2.5 py-1.5 rounded-lg bg-white/10 hover:bg-white/20 text-white transition-colors border border-white/15"
                title="Alternar entre modo de edição e visualização"
              >
                {activeMode === 'edit' ? <Eye className="w-3.5 h-3.5" /> : <Edit3 className="w-3.5 h-3.5" />}
                <span>{activeMode === 'edit' ? 'Ver Como Leitura' : 'Ativar Edição'}</span>
              </button>
            )}

            {/* Tela Cheia */}
            <button
              onClick={() => setIsFullScreen(!isFullScreen)}
              className="p-1.5 hover:bg-white/10 text-emerald-200 hover:text-white rounded-lg transition-colors"
              title={isFullScreen ? "Restaurar tamanho" : "Tela cheia"}
            >
              {isFullScreen ? <Minimize2 className="w-4 h-4" /> : <Maximize2 className="w-4 h-4" />}
            </button>

            {/* Fechar */}
            <button
              onClick={handleSafeClose}
              className="p-1.5 hover:bg-white/10 text-emerald-200 hover:text-white rounded-lg transition-colors"
              title="Fechar visualizador"
            >
              <X className="w-5 h-5" />
            </button>
          </div>
        </div>

        {/* MODO PDF */}
        {isPdf ? (
          <div className="flex-1 flex flex-col bg-gray-100 overflow-hidden relative">
            <div className="bg-amber-50 border-b border-amber-200 px-4 py-2 flex items-center justify-between text-xs text-amber-800">
              <span className="flex items-center gap-1.5 font-medium">
                <Info className="w-4 h-4 text-amber-600" />
                Documento em formato PDF. Modo de leitura integrado.
              </span>
              <button

                className="bg-white hover:bg-amber-100 text-amber-900 border border-amber-300 px-2.5 py-1 rounded font-semibold flex items-center gap-1 transition-colors"
              >
                <Download className="w-3.5 h-3.5" /> Baixar PDF
              </button>
            </div>
            <iframe 
              src={plano.fileDataUrl || plano.url} 
              className="w-full flex-1 border-0" 
              title="Visualizador de PDF"
            />
          </div>
        ) : (
          /* MODO PLANILHA EXCEL / CSV / IA */
          <div className="flex-1 flex flex-col overflow-hidden bg-slate-50">
            
            {/* BARRA DE FERRAMENTAS E ABAS */}
            <div className="bg-white border-b border-gray-200 px-4 py-2.5 flex flex-wrap items-center justify-between gap-3 shrink-0">
              
              {/* Abas da Planilha (Worksheets) */}
              <div className="flex items-center gap-1.5 overflow-x-auto max-w-full sm:max-w-md py-0.5 pr-2">
                <span className="text-[11px] text-gray-400 font-bold uppercase tracking-wider mr-1 shrink-0">Abas:</span>
                {sheetNames.map((sName, idx) => (
                  <button
                    key={idx}
                    onClick={() => {
                      setActiveSheetIndex(idx);
                      setSelectedCell({ row: 0, col: 0 });
                      setIsInlineEditing(false);
                    }}
                    className={`px-3 py-1 rounded-lg text-xs font-semibold transition-all shrink-0 flex items-center gap-1.5 border ${
                      activeSheetIndex === idx
                        ? 'bg-emerald-600 text-white border-emerald-600 shadow-sm ring-2 ring-emerald-100'
                        : 'bg-gray-50 text-gray-700 hover:bg-gray-100 border-gray-200'
                    }`}
                  >
                    <FileText className="w-3 h-3" />

                  </button>
                ))}
              </div>

              {/* Controles e Botões de Ação */}
              <div className="flex flex-wrap items-center gap-2">

                <div className="relative">

                {searchMatchesCount > 0 && (

                  </span>

                {/* Ações de Edição para Nutricionista */}
                {!readOnly && activeMode === 'edit' && (

                    <button

                    >

                    <button

                    >
                      <Trash2 className="w-3.5 h-3.5 text-red-500" />

                    {/* Botão Assistente IA (Chatbot Opcional) */}

            </div>

            {/* BARRA DE FÓRMULA / COORDENADA DA CÉLULA */}

            {/* RODAPÉ INFORMATIVO */}

// ==========================================
// 3. VISÃO DE PLANOS ALIMENTARES (NUTRICIONISTA)
